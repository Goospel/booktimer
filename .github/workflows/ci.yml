name: CI

# PR에서 test 게이트만 돌린다(배포는 deploy.yml이 main push 때). H2라 Docker 불필요.
# paths-ignore를 일부러 두지 않는다 — required status check가 "test 통과 필수"인데
# 문서-only PR에서 job이 스킵되면 체크가 pending으로 남아 PR을 영영 못 머지한다.
on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 줄끝 규칙(.gitattributes)과 저장소 blob이 맞는지 — 어긋난 파일은 모든 작업 폴더에서 내용 변화 없이
      # 영구 「수정됨」이 되어 브랜치 전환·rebase를 막는다(T-108 — dependabot gradle wrapper 업데이트가
      # 2026-06·2026-10 두 번 CRLF gradlew.bat을 넣었다). 걸리면 그 PR에 `git add --renormalize <파일>` 한 커밋.
      - name: Verify line endings match .gitattributes
        run: |
          git add --renormalize .
          git diff --cached --name-only --exit-code
      # forwarded 헤더 신뢰 경계. 앱 테스트로는 원리상 못 잡는다(경계가 Caddy에 있다) —
      # 여기가 뚫리면 로그인 IP 잠금이 통째로 무력화되므로 PR 게이트에 둔다. 러너에 Docker 내장.
      - name: Verify Caddy forwarded-header trust boundary
        run: bash deploy/tests/test-caddy-forwarded.sh
      # SSM→.env 매핑 계약. 매핑이 빠지면 앱은 멀쩡히 뜨는데 그 기능만 조용히 꺼진 채 돈다(무성 장애).
      # 로컬 수동이라 #1172가 CHAT_ENABLED 매핑을 모의 갱신 없이 머지했고, 「정상 렌더」가 exit=1로
      # 죽어 파일 전체가 3일간 빨간불인 걸 아무도 몰랐다(2026-09-22 발견). 그래서 PR 게이트로 올린다.
      - name: Verify SSM-to-env mapping contract
        run: bash deploy/tests/test-render-env.sh
      # MySQL 운영 계약 — 필기 사진(BLOB)이 생긴 뒤로 덤프 플래그가 조용히 빠지면 복원할 때에야 드러나고, binlog가 다시 켜지면 디스크가 조용히 찬다.
      # 로컬 수동이면 깨져도 모른다(render-env 선례).
      - name: Verify MySQL backup and binlog contract
        run: bash deploy/tests/test-backup-mysql.sh
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            miniapp/package-lock.json
      - name: Install frontend deps
        run: npm --prefix frontend ci
      - name: Run frontend tests
        run: npm --prefix frontend test
      - name: Build frontend bundle
        run: npm --prefix frontend run build
      # garden뿐 아니라 10섬 전체를 검사한다 — garden만 보면 profile 등 9섬 stale이
      # CI를 통과해 새어나간다(T-082). build 스텝이 이미 전 섬을 빌드하므로 검사만 넓힌다.
      - name: Verify bundle is not stale
        run: git diff --exit-code src/main/resources/static
      # 미니앱은 백엔드 API 타입(record)을 단일 출처로 쓰므로 백엔드 변경이 miniapp 테스트를
      # 깰 수 있다 — 배포(miniapp/deploy.sh) 때만 돌면 너무 늦어 PR 단계에서 막는다.
      - name: Install miniapp deps
        run: npm --prefix miniapp ci
      - name: Run miniapp tests
        run: npm --prefix miniapp test
      # 책생글 앱(Expo SDK 58) — react-native 0.88 · metro가 Node 22+를 요구해 따로 올린다(위 20은 frontend·miniapp 몫).
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app deps
        run: npm --prefix app ci
      - name: Run app tests
        run: npm --prefix app test
      # 런타임 규칙(REQ-69) — 지금 iOS 지문 · version을 잠금과, 잠금을 main의 잠금과 대조한다.
      # 지문이 바뀐 JS가 EAS Update로 맞지 않는 바이너리(TF#1 · 0.1.0)에 게시되는 것을 막는다.
      # --base는 main에 잠금 파일이 없을 때만 뺀다(스크립트가 「main 대조 건너뜀」을 찍는다). fetch 실패는 스텝 실패.
      - name: Verify app fingerprint lock
        run: |
          git fetch --depth=1 origin main
          if git cat-file -e FETCH_HEAD:app/fingerprint.lock.json 2>/dev/null; then
            git show FETCH_HEAD:app/fingerprint.lock.json > "$RUNNER_TEMP/base-lock.json"
            node app/scripts/check-fingerprint.js --base "$RUNNER_TEMP/base-lock.json"
          else
            node app/scripts/check-fingerprint.js
          fi
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run tests
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon
