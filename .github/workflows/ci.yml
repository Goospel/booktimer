name: CI

# PR에서 test 게이트만 돌린다(배포는 deploy.yml이 main push 때). H2라 Docker 불필요.
# paths-ignore를 일부러 두지 않는다 — required status check가 "test 통과 필수"인데
# 문서-only PR에서 job이 스킵되면 체크가 pending으로 남아 PR을 영영 못 머지한다.
on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm --prefix frontend ci
      - name: Run frontend tests
        run: npm --prefix frontend test
      - name: Build frontend bundle
        run: npm --prefix frontend run build
      # garden뿐 아니라 10섬 전체를 검사한다 — garden만 보면 profile 등 9섬 stale이
      # CI를 통과해 새어나간다(T-082). build 스텝이 이미 전 섬을 빌드하므로 검사만 넓힌다.
      - name: Verify bundle is not stale
        run: git diff --exit-code src/main/resources/static
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run tests
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon
