name: Deploy to EC2

# main에 push되면: 테스트 게이트 → ECR 이미지 push → EC2 blue-green 배포(SSM) → 라이브 헬스체크.
# (2026-07-28 ECS Fargate에서 이전 — 배경·런북은 claude-docs/deploy-ec2.md)
on:
  push:
    branches: [main]
    # 문서/로컬 개발 도구만 바뀐 push는 배포할 게 없으므로 건너뛴다(~5분 절약).
    # paths-ignore는 "바뀐 파일이 전부 아래 패턴에 해당할 때만" 워크플로를 건너뛴다 —
    # 코드(src·Dockerfile·build.gradle·deploy/ 등)가 하나라도 끼면 정상 배포된다(안전 기본값).
    paths-ignore:
      - '**.md'           # README·CLAUDE·claude-docs 등 모든 마크다운
      - 'claude-docs/**'  # 문서 디렉터리(비-md 자료 포함)
      - '.claude/**'      # 로컬 훅·설정(배포 산출물과 무관)
  workflow_dispatch: {}   # 수동 트리거도 허용 (paths-ignore 영향 없음)

jobs:
  # 1) 테스트 게이트 — 통과해야 배포 진행
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run tests
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon

  # 2) 빌드·푸시·배포 (테스트 통과 후)
  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # OIDC 토큰 발급(역할 assume)
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$TAG" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"
          echo "uri=$REGISTRY/$REPOSITORY:$TAG" >> "$GITHUB_OUTPUT"

      # 배포 자산(compose·Caddyfile·스크립트)을 S3로 동기화 — EC2가 여기서 받아간다.
      # tests/는 EC2에서 쓰지 않으므로 제외한다.
      - name: Sync deploy assets to S3
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          aws s3 sync deploy/ "s3://booktimer-ops-$ACCOUNT_ID/deploy/" \
            --exclude 'tests/*' --only-show-errors

      # EC2에서 blue-green 전환 실행 (SSH 키 없이 SSM Send-Command로).
      # deploy-on-ec2.sh가 새 컨테이너를 띄우고 헬스 통과 후에야 옛 것을 내린다 —
      # 실패하면 옛 컨테이너가 계속 서비스하고 이 스텝이 논제로로 끝난다.
      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          REGION: ${{ secrets.AWS_REGION }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          CMD="cd /opt/booktimer && aws s3 sync s3://booktimer-ops-$ACCOUNT_ID/deploy/ . --only-show-errors && chmod +x *.sh && export AWS_REGION=$REGION && ./deploy-on-ec2.sh"
          printf '{"commands":["%s"]}' "$CMD" > /tmp/ssm-params.json

          ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 1200 \
            --parameters file:///tmp/ssm-params.json \
            --query Command.CommandId --output text)
          echo "CommandId=$ID"

          # wait는 실패 상태에서도 논제로로 끝나므로 삼키고, 아래에서 상태를 명시 검증한다
          # (그래야 실패 원인 로그를 출력할 수 있다).
          aws ssm wait command-executed --command-id "$ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          STATUS=$(aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          if [ "$STATUS" != "Success" ]; then
            echo "::error::EC2 배포 실패 (status=$STATUS)"
            aws ssm get-command-invocation --command-id "$ID" --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' --output text | tail -50
            exit 1
          fi

      # 배포가 "성공"인데 실제 서비스엔 반영 안 되는 무성 실패를 막는 최종 게이트.
      - name: Verify live health
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://booktimer.app/actuator/health || true)
            if [ "$CODE" = "200" ]; then echo "live health OK"; exit 0; fi
            echo "attempt $i: http=$CODE"; sleep 5
          done
          echo "::error::배포 후 라이브 헬스체크 실패"
          exit 1
