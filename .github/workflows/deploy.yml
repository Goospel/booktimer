name: Deploy to ECS Fargate

# main에 push되면: 테스트 게이트 → ECR 이미지 push → ECS 롤링 배포.
on:
  push:
    branches: [main]
    # 문서/로컬 개발 도구만 바뀐 push는 배포할 게 없으므로 건너뛴다(~5분 절약).
    # paths-ignore는 "바뀐 파일이 전부 아래 패턴에 해당할 때만" 워크플로를 건너뛴다 —
    # 코드(src·Dockerfile·build.gradle·deploy/ 등)가 하나라도 끼면 정상 배포된다(안전 기본값).
    paths-ignore:
      - '**.md'           # README·CLAUDE·claude-docs 등 모든 마크다운
      - 'claude-docs/**'  # 문서 디렉터리(비-md 자료 포함)
      - '.claude/**'      # 로컬 훅·설정(배포 산출물과 무관)
  workflow_dispatch: {}   # 수동 트리거도 허용 (paths-ignore 영향 없음)

env:
  CONTAINER_NAME: booktimer

jobs:
  # 1) 테스트 게이트 — 통과해야 배포 진행
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Run tests
        run: |
          chmod +x ./gradlew
          ./gradlew test --no-daemon

  # 2) 빌드·푸시·배포 (테스트 통과 후)
  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write     # OIDC 토큰 발급(역할 assume)
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$TAG" -t "$REGISTRY/$REPOSITORY:latest" .
          docker push "$REGISTRY/$REPOSITORY:$TAG"
          docker push "$REGISTRY/$REPOSITORY:latest"
          echo "uri=$REGISTRY/$REPOSITORY:$TAG" >> "$GITHUB_OUTPUT"

      # 리포의 태스크 정의(IaC)를 소스로 사용 — placeholder만 실값으로 치환.
      # describe-task-definition은 register가 거부하는 읽기전용 필드가 섞여 불안정하므로 쓰지 않는다.
      - name: Resolve task definition placeholders
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          sed -e "s/<ACCOUNT_ID>/$ACCOUNT_ID/g" \
              -e "s/<REGION>/${{ secrets.AWS_REGION }}/g" \
              deploy/task-definition.json > task-definition.json

      # 새 이미지만 갈아끼운 태스크 정의 생성
      - name: Render new image into task definition
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}

      # 새 리비전 등록 + 서비스 업데이트 + 안정화 대기(롤링)
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true
