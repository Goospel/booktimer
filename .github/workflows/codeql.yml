name: CodeQL

# CodeQL — 내 코드의 보안 취약점을 정적 분석한다(SAST). PUBLIC repo라 무료.
# gap#4(CI 보안 게이트): 의존성(SCA)은 Dependabot(.github/dependabot.yml)이 담당.
#
# required check(branch protection: "Analyze (java-kotlin)"·"Analyze (javascript-typescript)").
# 단 "스마트 조건부": 문서-only PR이면 CodeQL 분석을 건너뛰되 job 자체는 성공으로 끝낸다
#   → 문서 PR은 수 초 안에 통과(매 PR +3분 세금 회피), 코드 PR만 풀 분석으로 강제.
# ⚠️ job을 path로 'skip'하지 않고 '항상 실행하되 내부 스텝만 조건부'로 둔다 — required 체크가
#    skip되면 pending으로 남아 PR을 영영 못 막는 함정(N-070) 회피. job은 늘 success로 끝난다.
# build-mode: none — Java도 빌드 없이 분석(Gradle/Java21 toolchain 빌드 복잡성 회피).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'   # 매주 월요일 04:17 UTC — 새 CodeQL 룰셋 반영

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # SARIF 결과 업로드
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 변경 파일 diff(merge-base 기준)용 — 전체 히스토리 필요

      # 문서-only PR이면 분석을 건너뛴다. PR이 아니면(push/schedule) 항상 전체 분석.
      # 판단이 모호하거나 diff가 실패하면 fail-safe로 분석한다(code=true) — 건너뛰어
      # 취약점을 놓치느니 가끔 불필요한 3분을 쓰는 쪽이 안전.
      - name: Detect code changes
        id: detect
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "non-PR event → 전체 분석"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          changed=$(git diff --name-only "$base"..."$head" 2>/dev/null) || {
            echo "diff 실패 → fail-safe 전체 분석"; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if printf '%s\n' "$changed" | grep -qE '\.(java|kt|kts|js|cjs|mjs|ts|tsx|vue)$|(^|/)(build|settings)\.gradle$|(^|/)Dockerfile$|(^|/)package(-lock)?\.json$'; then
            echo "코드 변경 감지 → 전체 분석"; echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "코드 변경 없음(문서-only) → CodeQL 건너뜀"; echo "code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        if: steps.detect.outputs.code == 'true'
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        if: steps.detect.outputs.code == 'true'
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

      - name: Skip note (docs-only PR)
        if: steps.detect.outputs.code != 'true'
        run: echo "코드 변경 없음 — CodeQL 분석 건너뜀(문서-only PR). job은 success로 통과(required-safe)."
