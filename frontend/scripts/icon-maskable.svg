<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- maskable: 배경 풀블리드(클리핑 대응) — 모서리 없음 -->
  <rect width="512" height="512" fill="#6E8A6A"/>

  <!-- 안전 영역(safe zone) 내 배치: 반경 ~205px 원 안에 콘텐츠 집중.
       책을 조금 더 작게, 중앙에 집중해 어떤 형태로 잘려도 인식 가능. -->

  <!-- 페이지 스택 효과 -->
  <rect x="168" y="120" width="190" height="272" rx="10" fill="#DDD6C6"/>

  <!-- 책 표지 본체 -->
  <rect x="156" y="116" width="192" height="272" rx="12" fill="#FCFAF5"/>

  <!-- 책 등 (spine) -->
  <rect x="156" y="116" width="34" height="272" rx="12" fill="#E4DDD0"/>
  <rect x="178" y="116" width="12" height="272" fill="#E4DDD0"/>

  <!-- spine 세로 선 -->
  <rect x="163" y="140" width="2" height="224" rx="1" fill="#C8BFAF" opacity="0.5"/>
  <rect x="171" y="140" width="2" height="224" rx="1" fill="#C8BFAF" opacity="0.5"/>

  <!-- 제목 -->
  <rect x="204" y="160" width="124" height="10" rx="5" fill="#6E8A6A" opacity="0.55"/>
  <rect x="204" y="178" width="96"  height="10" rx="5" fill="#6E8A6A" opacity="0.40"/>

  <!-- 본문 줄 -->
  <rect x="204" y="222" width="124" height="8" rx="4" fill="#C8BFAF"/>
  <rect x="204" y="242" width="124" height="8" rx="4" fill="#C8BFAF"/>
  <rect x="204" y="262" width="100" height="8" rx="4" fill="#C8BFAF"/>
  <rect x="204" y="282" width="120" height="8" rx="4" fill="#C8BFAF"/>
  <rect x="204" y="302" width="80"  height="8" rx="4" fill="#C8BFAF"/>
  <rect x="204" y="322" width="108" height="8" rx="4" fill="#C8BFAF"/>
</svg>
