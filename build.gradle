plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.booktimer'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	// 세션 외부화 — 세션을 JVM 메모리가 아닌 공유 DB(RDS)에 저장해 태스크 교체에도 로그인 유지.
	// Boot 4는 autoconfig가 별도 모듈이라 raw 라이브러리(spring-session-jdbc)만으론 빈이 안 생긴다 —
	// starter가 라이브러리 + spring-boot-session-jdbc(autoconfig)를 함께 가져온다(N-024와 같은 패턴).
	// (스키마는 Flyway V2가 운영에 생성, 테스트 H2는 initialize-schema=embedded 기본값으로 자동 생성)
	implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
	// 이메일 발송(transactional) — JavaMailSender 자동구성. 실발송은 booktimer.email.enabled=true일 때만.
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	// Claude API(공부 화면 백지복습 분석). anthropic-java-core가 Jackson **2**(com.fasterxml) databind를
	// 끌고 오는데, 이 앱은 Jackson **3**(tools.jackson)을 쓴다 — 패키지가 달라 클래스 충돌은 없고
	// 버전은 Boot BOM이 각각 고정한다(설계 U-1: 두 databind가 런타임 클래스패스에 공존).
	implementation 'com.anthropic:anthropic-java:2.61.0'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testRuntimeOnly 'com.h2database:h2'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-session-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()

	// 테스트 JVM 힙을 명시한다 — 기본값에 기대면 스위트가 자라다 어느 날 OutOfMemoryError로 죽는다.
	//
	// 원인은 테스트 수가 아니라 **Spring 컨텍스트 수**다. @SpringBootTest는 properties·@MockitoBean이
	// 다르면 각각 별개 컨텍스트를 띄우고, 그것들이 캐시에 **동시에 살아 있다**(캐시가 목적이다).
	// 2026-09-08에 AI 상한 테스트가 컨텍스트를 둘 더하자(daily-cap=0 + 목 어댑터) 실제로 터졌다 —
	// 실패 지점이 무작위 테스트라 원인이 코드에 있는 것처럼 보이는 부류다.
	// 컨텍스트 수는 아래 예산 가드가 막는다.
	maxHeapSize = '2g'

	// ── 스프링 테스트 컨텍스트 예산 (T-235 후속, 설계 2026-09-28) ──
	// 컨텍스트 로드가 테스트 시간의 약 70%다(2026-09-28 실측: 38번 로드 = 서로 다른 서명 38개).
	// 새 @MockitoBean 필드·@TestPropertySource/@SpringBootTest(properties)·중첩 @TestConfiguration·
	// @DynamicPropertySource는 캐시 키를 갈라 컨텍스트를 하나 더 띄운다. testsupport 패키지의 공용 세계를
	// 재사용하고, 새 세계가 정말 필요하면 이 숫자를 올리고 PR 본문에 이유를 적는다.
	// 전제: 단일 포크(포크를 늘리면 포크마다 따로 떠서 수가 곱해진다) · 구성 캐시 미사용(클로저 리스너 —
	// 구성 캐시를 켜는 날 이 가드를 태스크 클래스로 옮긴다).
	def contextBudget = 21
	def contextLoads = 0
	def contextSeconds = 0d
	def appTestRan = false
	onOutput { descriptor, event ->
		(event.message =~ /Started \S+ in ([\d.]+) seconds/).each { match ->
			contextLoads++
			contextSeconds += (match[1] as double)
		}
	}
	afterSuite { descriptor, result ->
		if (descriptor.className == 'com.booktimer.BooktimerApplicationTests') {
			appTestRan = true
		}
	}
	doLast {
		logger.lifecycle(String.format('Spring test contexts: %d loaded, %.1f s startup total (budget %d)',
				contextLoads, contextSeconds, contextBudget))
		if (appTestRan && contextLoads == 0) {
			throw new GradleException('Context probe is broken: BooktimerApplicationTests ran but no "Started ... in ... seconds" line was seen. Was spring.main.log-startup-info turned off? See T-235.')
		}
		if (contextLoads > contextBudget) {
			throw new GradleException("Spring test contexts ${contextLoads} > budget ${contextBudget}. Reuse a shared world in src/test/java/com/booktimer/testsupport instead of new @MockitoBean fields, @TestPropertySource or nested @TestConfiguration. If a new world is really needed, raise contextBudget in build.gradle and say why in the PR. See T-235.")
		}
	}
}

tasks.named('bootRun') {
	// 로컬 개발 실행은 'local' 프로파일 — dev 전용 시드 빈(LocalTestAccountSeeder)을 켠다.
	// 운영 컨테이너는 SPRING_PROFILES_ACTIVE=prod로 이 설정과 무관하게 prod를 활성화한다(무간섭).
	systemProperty 'spring.profiles.active', 'local'
}

// Spring Boot는 실행가능 부트 jar 외에 일반(plain) jar도 만든다.
// Dockerfile이 build/libs/*.jar 를 단일 복사하므로, 모호함을 없애기 위해 plain jar 비활성.
tasks.named('jar') {
	enabled = false
}
