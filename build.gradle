plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.booktimer'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	// 세션 외부화 — 세션을 JVM 메모리가 아닌 공유 DB(RDS)에 저장해 태스크 교체에도 로그인 유지.
	// Boot 4는 autoconfig가 별도 모듈이라 raw 라이브러리(spring-session-jdbc)만으론 빈이 안 생긴다 —
	// starter가 라이브러리 + spring-boot-session-jdbc(autoconfig)를 함께 가져온다(N-024와 같은 패턴).
	// (스키마는 Flyway V2가 운영에 생성, 테스트 H2는 initialize-schema=embedded 기본값으로 자동 생성)
	implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
	// 이메일 발송(transactional) — JavaMailSender 자동구성. 실발송은 booktimer.email.enabled=true일 때만.
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testRuntimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-session-jdbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootRun') {
	// 로컬 개발 실행은 'local' 프로파일 — dev 전용 시드 빈(LocalTestAccountSeeder)을 켠다.
	// 운영 컨테이너는 SPRING_PROFILES_ACTIVE=prod로 이 설정과 무관하게 prod를 활성화한다(무간섭).
	systemProperty 'spring.profiles.active', 'local'
}

// Spring Boot는 실행가능 부트 jar 외에 일반(plain) jar도 만든다.
// Dockerfile이 build/libs/*.jar 를 단일 복사하므로, 모호함을 없애기 위해 plain jar 비활성.
tasks.named('jar') {
	enabled = false
}
