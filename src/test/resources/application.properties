# 테스트 전용 설정 — 운영 MySQL 대신 H2 인메모리 DB 사용
# (Docker/실DB 없이 테스트가 독립적으로 돌도록)

# H2 인메모리, MySQL 호환 모드
spring.datasource.url=jdbc:h2:mem:booktimer;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 매 테스트 컨텍스트마다 스키마 생성/삭제
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# 테스트 시 docker-compose 자동 기동 비활성화 (H2만 쓰므로 불필요)
spring.docker.compose.enabled=false

# --- OAuth2 (Google) 더미 등록 ---
# 같은 파일명의 test properties가 main을 "덮어쓰므로"(병합 아님) 여기에도 google 등록이 있어야
# 테스트 컨텍스트에 ClientRegistrationRepository가 생성된다. 실제 인증 흐름은 타지 않고,
# oauth2Login 필터 배선·인가요청 리다이렉트만 검증하므로 더미 값으로 충분하다.
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,email,profile
