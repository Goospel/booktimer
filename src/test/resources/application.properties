# 테스트 전용 설정 — 운영 MySQL 대신 H2 인메모리 DB 사용
# (Docker/실DB 없이 테스트가 독립적으로 돌도록)

# H2 인메모리, MySQL 호환 모드
spring.datasource.url=jdbc:h2:mem:booktimer;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 메인 테스트 스위트는 Hibernate가 매 컨텍스트마다 스키마를 만든다(빠르고 격리됨).
# Flyway 마이그레이션 검증은 전용 테스트(FlywayMigrationTest)가 별도 격리 DB에서 따로 한다 —
# @DataJpaTest 슬라이스가 데이터소스를 순정 H2로 교체하면 MySQL 문법 마이그레이션이 깨지고,
# 공유 인메모리 DB는 create-drop 없이는 테스트 간 데이터가 남기 때문.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# 메인 스위트에서는 Flyway 비활성 (위 사유). FlywayMigrationTest만 켜서 마이그레이션을 검증한다.
spring.flyway.enabled=false

# 테스트 시 docker-compose 자동 기동 비활성화 (H2만 쓰므로 불필요)
spring.docker.compose.enabled=false

# --- OAuth2 (Google) 더미 등록 ---
# 같은 파일명의 test properties가 main을 "덮어쓰므로"(병합 아님) 여기에도 google 등록이 있어야
# 테스트 컨텍스트에 ClientRegistrationRepository가 생성된다. 실제 인증 흐름은 타지 않고,
# oauth2Login 필터 배선·인가요청 리다이렉트만 검증하므로 더미 값으로 충분하다.
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,email,profile
