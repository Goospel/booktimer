# 운영(prod) 프로필 — 컨테이너에서 SPRING_PROFILES_ACTIVE=prod 로 활성화.
# DB 접속 정보는 절대 커밋하지 않는다. 컨테이너 환경변수로 주입(아래 placeholder가 그 값을 읽음).
#   SPRING_DATASOURCE_URL=jdbc:mysql://<RDS-엔드포인트>:3306/booktimer
#   SPRING_DATASOURCE_USERNAME=...
#   SPRING_DATASOURCE_PASSWORD=...
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 스키마는 Flyway가 관리한다(db/migration). Hibernate는 스키마에 손대지 않는다(none).
# (validate가 아니라 none인 이유: 기존 운영 DB와 엔티티 매핑의 미세한 타입 차이로 기동이
#  막히는 위험을 피하기 위함. 드리프트는 테스트가 Flyway 스키마 위에서 실제로 돌며 잡는다.)
spring.jpa.hibernate.ddl-auto=none

# 운영엔 docker-compose 연동 비활성(개발 전용 기능 — 컨테이너 내부엔 docker 소켓 없음).
spring.docker.compose.enabled=false

# 배포 헬스체크용으로 health 엔드포인트만 노출(SecurityConfig에서 공개 처리됨).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# mail 헬스체크는 기본 활성으로 둔다(끄지 않음) — SES 점등·실발송 검증(PR #312) 후 JavaMailSender가 SMTP에
# 실연결되어 health가 UP이다. 과거엔 host가 빈 값(SES 미가동)이라 헬스가 빈 host 연결을 시도→DOWN→
# /actuator/health 503→ALB unhealthy→ECS 무한 replace→배포 타임아웃을 유발해 management.health.mail.enabled=false로
# 껐었다(T-009 계열). 실연결인 지금 그 제외를 풀어, mail DOWN이 진짜 SMTP 장애 신호로 작동하게 했다.

# 운영은 HTTPS이므로 세션 쿠키를 HTTPS로만 전송(Secure). 평문 구간 탈취 차단.
# prod 전용 — 로컬은 http://localhost라 Secure를 켜면 쿠키가 안 실려 로그인이 안 된다.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# 세션 외부화(Spring Session JDBC) — 세션 테이블은 Flyway V2가 만든다(스키마 단일 소스).
# 따라서 Spring Session의 자동 스키마 초기화는 끈다(never). 안 끄면 Flyway와 CREATE가 충돌한다.
spring.session.jdbc.initialize-schema=never

# --- 이메일 발송 SMTP (SES) ---
# 자격증명은 절대 커밋하지 않는다 — 컨테이너 환경변수로 주입(아래 placeholder가 읽음).
# 발송 인프라(도메인 검증·DNS)가 준비되면 BOOKTIMER_EMAIL_ENABLED=true 로 켠다(기본 false면 로그만).
#   BOOKTIMER_EMAIL_ENABLED=true
#   SPRING_MAIL_HOST=email-smtp.<region>.amazonaws.com
#   SPRING_MAIL_USERNAME=<SES SMTP user>
#   SPRING_MAIL_PASSWORD=<SES SMTP password>
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# 인증·재설정 메일 링크의 절대 URL 베이스. 운영은 반드시 실제 호스트를 주입한다 — 빠뜨리면 코드 기본값
# (http://localhost:8080)으로 떨어져 발송된 인증 링크가 전부 죽는다(SMTP 켜기 전 필수 설정).
#   BOOKTIMER_BASE_URL=https://booktimer.app  (운영 도메인. .click→.app 이전, N-036)
booktimer.base-url=${BOOKTIMER_BASE_URL:http://localhost:8080}
