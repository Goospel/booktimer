# 운영(prod) 프로필 — 컨테이너에서 SPRING_PROFILES_ACTIVE=prod 로 활성화.
# DB 접속 정보는 절대 커밋하지 않는다. 컨테이너 환경변수로 주입(아래 placeholder가 그 값을 읽음).
#   SPRING_DATASOURCE_URL=jdbc:mysql://<RDS-엔드포인트>:3306/booktimer
#   SPRING_DATASOURCE_USERNAME=...
#   SPRING_DATASOURCE_PASSWORD=...
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 스키마는 Flyway가 관리한다(db/migration). Hibernate는 스키마에 손대지 않는다(none).
# (validate가 아니라 none인 이유: 기존 운영 DB와 엔티티 매핑의 미세한 타입 차이로 기동이
#  막히는 위험을 피하기 위함. 드리프트는 테스트가 Flyway 스키마 위에서 실제로 돌며 잡는다.)
spring.jpa.hibernate.ddl-auto=none

# 운영엔 docker-compose 연동 비활성(개발 전용 기능 — 컨테이너 내부엔 docker 소켓 없음).
spring.docker.compose.enabled=false

# 배포 헬스체크용으로 health 엔드포인트만 노출(SecurityConfig에서 공개 처리됨).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# 운영은 HTTPS이므로 세션 쿠키를 HTTPS로만 전송(Secure). 평문 구간 탈취 차단.
# prod 전용 — 로컬은 http://localhost라 Secure를 켜면 쿠키가 안 실려 로그인이 안 된다.
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
