<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <header class="brand">
        <span class="emoji">📚</span>
        <h1>BookTimer</h1>
    </header>
    <div class="entry-hero">
        <h2>책 읽는 습관, 오늘부터</h2>
        <p>하루 딱 이만큼만. 작은 독서 습관을 함께 시작해요.</p>
    </div>

    <section class="card">
        <form th:action="@{/signup}" th:object="${signupForm}" method="post">
            <div class="field">
                <label for="loginId">아이디</label>
                <input type="text" id="loginId" th:field="*{loginId}" autocomplete="username"
                       pattern="[A-Za-z0-9_]{3,20}" placeholder="영문/숫자/_ 3~20자">
                <small class="field-hint">로그인·검색·책방 주소(/u/아이디)에 쓰여요. ⚠️ 한번 정하면 바꿀 수 없어요.</small>
                <span class="field-error" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}">아이디 오류</span>
            </div>
            <div class="field">
                <label for="password">비밀번호</label>
                <input type="password" id="password" th:field="*{password}" autocomplete="new-password"
                       minlength="8" placeholder="8자 이상">
                <small class="field-hint">최소 8자. 영문·숫자·기호를 섞으면 더 안전해요.</small>
                <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">비밀번호 오류</span>
            </div>
            <div class="field">
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" th:field="*{nickname}">
                <span class="field-error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}">닉네임 오류</span>
            </div>
            <div class="field">
                <label for="email">이메일</label>
                <input type="email" id="email" th:field="*{email}">
                <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">이메일 오류</span>
            </div>
            <div class="field">
                <label for="timezone">타임존</label>
                <select id="timezone" th:field="*{timezone}">
                    <option th:each="tz : ${timezones}" th:value="${tz}" th:text="${tz}">Asia/Seoul</option>
                </select>
                <small class="field-hint">하루의 시작·끝(자정)을 이 기준으로 계산해요. 잔디와 일일 기록이 내가 사는 곳의 날짜에 맞게 쌓이도록 거주 지역을 골라 주세요.</small>
                <span class="field-error" th:if="${#fields.hasErrors('timezone')}" th:errors="*{timezone}">타임존 오류</span>
            </div>
            <button type="submit" class="btn-primary">가입</button>
        </form>
    </section>

    <p class="link-row"><a th:href="@{/login}">이미 계정이 있나요? 로그인</a></p>
    <p class="link-row"><a th:href="@{/privacy}">개인정보처리방침</a></p>
</div>
</body>
</html>
