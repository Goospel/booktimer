<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <title>내 책장 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block th:replace="~{ads :: loader}"></th:block>
</head>
<body>
<div class="container shelf-page">
    <header class="brand">
        <a class="brand-home" th:href="@{/}" title="메인 대시보드로">
            <span class="emoji">📚</span>
            <h1>BookTimer</h1>
        </a>
    </header>
    <div id="books-app" th:attr="data-my-login-id=${myLoginId}">불러오는 중…</div>
    <noscript><p class="status-line">JavaScript가 필요합니다.</p></noscript>
    <div th:replace="~{ads :: unit}"></div>
</div>
<script type="module" th:src="@{/books/books.js}"></script>
</body>
</html>
