<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 방문 통계(GA4, 측정 ID 설정 시에만) -->
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>독서 기록 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!-- 광고 로더(게시자 ID 설정 시에만) -->
    <th:block th:replace="~{ads :: loader}"></th:block>
</head>
<body class="history-page">
<div class="container">
    <header class="brand">
        <a class="brand-home" th:href="@{/}" title="메인 대시보드로">
            <span class="emoji">📚</span>
            <h1>BookTimer</h1>
        </a>
    </header>

    <!-- Vue 섬 마운트 포인트 — data-nickname으로 초기값 전달 -->
    <div id="history-app" th:attr="data-nickname=${nickname}">불러오는 중…</div>
    <noscript>
        <p class="status-line muted">이 페이지는 JavaScript가 필요합니다.</p>
    </noscript>

    <!-- 광고 (하단, 게시자 ID 설정 시에만) -->
    <div th:replace="~{ads :: unit}"></div>
</div>
<!-- Spring resource chain이 런타임에 history-<hash>.js 로 변환 -->
<script type="module" th:src="@{/history/history.js}"></script>
</body>
</html>
