<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>독서 기록 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <header class="brand">
        <span class="emoji">📚</span>
        <h1>BookTimer</h1>
    </header>
    <p class="greeting"><span th:text="${nickname}">닉네임</span>님의 독서 기록</p>

    <!-- 독서 잔디 (지난 1년) — GitHub 컨트리뷰션 그래프 스타일 -->
    <section class="card">
        <h2>독서 잔디</h2>
        <p class="grass-summary">
            지난 1년 동안 <strong th:text="${graph.activeDays()}">0</strong>일 독서 ·
            총 <strong th:text="${graph.totalSeconds() / 3600 + '시간 ' + (graph.totalSeconds() % 3600) / 60 + '분'}">0시간 0분</strong>
        </p>
        <div class="grass">
            <!-- 좌측 요일 라벨 (월/수/금) -->
            <div class="grass-weekdays" aria-hidden="true">
                <span></span><span>월</span><span></span><span>수</span><span></span><span>금</span><span></span>
            </div>
            <div class="grass-main">
                <!-- 상단 월 라벨 -->
                <div class="grass-months" aria-hidden="true">
                    <span th:each="m : ${graph.monthLabels()}"
                          th:text="${m.label()}"
                          th:style="'grid-column-start:' + (${m.weekIndex()} + 1)">1월</span>
                </div>
                <!-- 53주 × 7요일 그리드 (열 방향으로 채워짐) -->
                <div class="grass-grid">
                    <th:block th:each="week : ${graph.weeks()}">
                        <div class="grass-cell"
                             th:each="day : ${week}"
                             th:classappend="${day.isPlaceholder() ? 'empty' : 'level-' + day.level()}"
                             th:attr="title=${day.isPlaceholder() ? null
                                 : #temporals.format(day.date(), 'yyyy-MM-dd') + ' · ' + (day.totalSeconds() / 60) + '분'}"></div>
                    </th:block>
                </div>
                <!-- 범례 -->
                <div class="grass-legend" aria-hidden="true">
                    <span>적음</span>
                    <i class="grass-cell level-0"></i>
                    <i class="grass-cell level-1"></i>
                    <i class="grass-cell level-2"></i>
                    <i class="grass-cell level-3"></i>
                    <i class="grass-cell level-4"></i>
                    <span>많음</span>
                </div>
            </div>
        </div>
    </section>

    <!-- 기록 없음 -->
    <section class="card" th:if="${records.isEmpty()}">
        <p class="status-line">아직 독서 기록이 없습니다. 측정을 시작해 보세요.</p>
    </section>

    <!-- 일자별 기록 (최신순) -->
    <section class="card" th:unless="${records.isEmpty()}">
        <h2>일자별 독서 시간</h2>
        <ul class="record-list">
            <li class="record-row" th:each="r : ${records}">
                <span class="record-date" th:text="${#temporals.format(r.date(), 'yyyy-MM-dd (E)')}">2026-06-01</span>
                <span class="record-time mono"
                      th:text="${(r.totalSeconds() / 3600) + '시간 ' + ((r.totalSeconds() % 3600) / 60) + '분'}">0시간 0분</span>
                <span class="record-count" th:text="${r.sessionCount() + '회'}">0회</span>
            </li>
        </ul>
    </section>

    <p class="link-row">
        <a th:href="@{/}">← 대시보드</a>
        <a th:href="@{/books}">📚 내 책장</a>
    </p>
</div>
</body>
</html>
