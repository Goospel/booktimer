<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>차단 목록 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <header class="brand">
        <a class="brand-home" th:href="@{/}" title="메인 대시보드로">
            <span class="emoji">📚</span>
            <h1>BookTimer</h1>
        </a>
    </header>
    <p class="greeting">차단 목록</p>

    <section class="card">
        <h2>내가 차단한 사용자</h2>
        <p class="status-line muted">차단한 사용자와는 서로 팔로우·프로필 열람이 막힙니다. 해제하면 다시 가능합니다.</p>

        <p th:if="${blocked.isEmpty()}" class="status-line">차단한 사용자가 없습니다.</p>
        <ul class="book-list" th:unless="${blocked.isEmpty()}">
            <li class="book-row" th:each="u : ${blocked}">
                <div class="book-meta">
                    <!-- 차단 상태라 프로필은 404 — 표시 이름은 링크 없이, @아이디는 보조로 -->
                    <span class="book-title" th:text="${u.nickname}">닉네임</span>
                    <span class="book-author" th:text="'@' + ${u.loginId}">@아이디</span>
                </div>
                <div class="book-actions">
                    <form method="post" th:action="@{/unblock}">
                        <input type="hidden" name="loginId" th:value="${u.loginId}">
                        <button type="submit" class="btn-ghost">차단 해제</button>
                    </form>
                </div>
            </li>
        </ul>
    </section>

    <p class="link-row">
        <a th:href="@{/}">← 대시보드</a>
        <a th:href="@{/u/{n}(n=${loginId})}">📖 내 책방</a>
    </p>
</div>
</body>
</html>
