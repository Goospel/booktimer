<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 방문 통계(GA4, 측정 ID 설정 시에만) -->
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>이메일 인증 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <header class="brand">
        <span class="emoji">📚</span>
        <h1>BookTimer</h1>
    </header>

    <section class="card">
        <div th:if="${verified}">
            <div class="entry-hero">
                <h2>이메일 인증 완료 🎉</h2>
                <p>이메일 인증이 완료됐어요. 이제 모든 기능을 안심하고 쓰실 수 있어요.</p>
            </div>
            <a class="btn-primary" th:href="@{/}" style="display:block">시작하기</a>
        </div>
        <div th:unless="${verified}">
            <div class="entry-hero">
                <h2>인증 링크가 만료됐어요</h2>
                <p>이 인증 링크는 만료됐거나 이미 사용됐어요. 로그인 후 설정에서 인증 메일을 다시 받을 수 있어요.</p>
            </div>
            <a class="btn-primary" th:href="@{/login}" style="display:block">로그인하러 가기</a>
        </div>
    </section>
</div>
</body>
</html>
