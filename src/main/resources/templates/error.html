<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 방문 통계(GA4, 측정 ID 설정 시에만) -->
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>오류 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <header class="brand">
        <svg class="brand-ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="3.4" height="16" rx="1"/><rect x="9.3" y="4" width="3.4" height="16" rx="1"/><path d="M15 5.4l3.3-.7 2.4 15.4-3.3.7z"/></svg>
        <h1>BookTimer</h1>
    </header>

    <section class="card">
        <h2>문제가 발생했어요</h2>
        <p class="timer-display" th:text="${status} ?: '오류'">500</p>
        <p class="status-line" th:text="${message} ?: '요청을 처리하지 못했습니다.'">
            요청을 처리하지 못했습니다.
        </p>
    </section>

    <p class="link-row"><a th:href="@{/}">← 대시보드로</a></p>
</div>
</body>
</html>
