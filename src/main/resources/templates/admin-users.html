<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 방문 통계(GA4, 측정 ID 설정 시에만) -->
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>사용자 목록 — 관리자</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        /* 운영자 표는 컬럼이 8개라 모바일 우선 폭(.container 460px)에선 짓눌린다.
           이 페이지는 데스크톱 사용이 대부분이므로 컨테이너를 넓혀 표가 자연스럽게 펼쳐지게 한다.
           페이지 내 <style>이 app.css보다 늦게 와서 이 페이지에서만 덮어쓴다(다른 화면 영향 없음). */
        .container { max-width: 920px; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; font-size: 0.9rem; }
        .admin-table th, .admin-table td { padding: 0.5rem 0.6rem; border-bottom: 1px solid rgba(0,0,0,0.08); text-align: left; }
        .admin-table th { font-size: 0.8rem; opacity: 0.7; }
        .admin-table tr:hover { background: rgba(0,0,0,0.02); }
        .admin-table details { display: inline; }
        .admin-table details summary { cursor: pointer; list-style: none; }
        .role-badge { font-size: 0.7rem; padding: 0.1rem 0.4rem; border-radius: 6px; background: rgba(0,0,0,0.06); }
        .role-badge.admin { background: #ffe0b2; }
        .verify-badge { font-size: 0.7rem; padding: 0.1rem 0.4rem; border-radius: 6px; background: rgba(0,0,0,0.06); }
        .verify-badge.unverified { background: #ffcdd2; }   /* 미인증만 눈에 띄게 — 후속 독려 대상 식별 */
        .pager { display: flex; gap: 0.5rem; align-items: center; margin-top: 0.8rem; }
        .pager .muted { opacity: 0.6; }
    </style>
</head>
<body>
<div class="container">
    <header class="brand">
        <h1>사용자 목록</h1>
    </header>

    <form class="book-search-form" method="get" th:action="@{/admin/users}">
        <input type="text" name="q" th:value="${q}" placeholder="아이디 또는 닉네임 검색">
        <button type="submit">검색</button>
    </form>

    <section class="card">
        <p class="status-line muted">
            총 <span th:text="${userPage.totalElements}">0</span>명
            (email은 클릭 시 전체 표시 · 비밀번호는 노출하지 않음)
        </p>

        <div th:if="${userPage.isEmpty()}">
            <p class="muted">해당하는 사용자가 없습니다.</p>
        </div>

        <table class="admin-table" th:unless="${userPage.isEmpty()}">
            <thead>
            <tr>
                <th>@아이디</th>
                <th>닉네임</th>
                <th>email</th>
                <th>인증</th>
                <th>provider</th>
                <th>가입일</th>
                <th>온보딩</th>
                <th>역할</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${userPage.content}">
                <td>
                    <a th:href="@{/admin/users/{id}(id=${row.loginId})}" th:text="'@' + ${row.loginId}">@handle</a>
                </td>
                <td th:text="${row.nickname}">닉네임</td>
                <td>
                    <details>
                        <summary th:text="${row.emailMasked}">m***@x.com</summary>
                        <span th:text="${row.email}">full@x.com</span>
                    </details>
                </td>
                <td>
                    <span class="verify-badge" th:classappend="${!row.emailVerified} ? ' unverified'"
                          th:text="${row.emailVerified} ? '인증' : '미인증'">인증</span>
                </td>
                <td th:text="${row.provider}">LOCAL</td>
                <td th:text="${#temporals.format(row.createdAt, 'yyyy-MM-dd')}">2026-01-01</td>
                <td th:text="${row.onboarded} ? '완료' : '미완'">완료</td>
                <td>
                    <span class="role-badge" th:classappend="${row.role.name() == 'ADMIN'} ? ' admin'"
                          th:text="${row.role}">USER</span>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="pager" th:if="${userPage.totalPages > 1}">
            <a th:if="${userPage.hasPrevious()}"
               th:href="@{/admin/users(q=${q}, page=${userPage.number - 1}, size=${userPage.size})}">← 이전</a>
            <span class="muted">
                <span th:text="${userPage.number + 1}">1</span> / <span th:text="${userPage.totalPages}">1</span>
            </span>
            <a th:if="${userPage.hasNext()}"
               th:href="@{/admin/users(q=${q}, page=${userPage.number + 1}, size=${userPage.size})}">다음 →</a>
        </div>
    </section>

    <nav class="link-row" aria-label="페이지 이동">
        <th:block th:replace="~{fragments/nav-links :: navLink(@{/admin}, 'back', '관리자 홈')}"></th:block>
    </nav>
</div>
</body>
</html>
