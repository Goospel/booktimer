<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 방문 통계(GA4, 측정 ID 설정 시에만) -->
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>빠뜨린 독서 기록 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <header class="brand">
        <a class="brand-home" th:href="@{/}" title="홈으로">
            <svg class="brand-ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="3.4" height="16" rx="1"/><rect x="9.3" y="4" width="3.4" height="16" rx="1"/><path d="M15 5.4l3.3-.7 2.4 15.4-3.3.7z"/></svg>
            <h1>BookTimer</h1>
        </a>
    </header>
    <p class="greeting">빠뜨린 독서 기록</p>

    <div th:if="${message}" class="alert" th:text="${message}">기록했어요</div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}">에러 메시지</div>

    <section class="card">
        <h2>읽었는데 측정을 깜빡했나요?</h2>
        <p class="status-line muted">
            측정 버튼을 안 눌렀어도, 읽은 <strong>책·날짜·시간</strong>을 직접 적으면 독서 기록·잔디에 그대로 반영돼요.
            적은 시간만큼 <strong>그 날짜의 부채</strong>가 채워집니다(최근 7일까지 — 그 이전은 자동으로 넘어가요).
        </p>

        <!-- 책 미지정 기록은 금지 — 고를 책이 없으면 폼 대신 추가 안내. -->
        <form th:if="${!books.isEmpty()}" th:action="@{/sessions/manual}" method="post">
            <div class="field">
                <label for="bookId">읽은 책</label>
                <select id="bookId" name="bookId" required>
                    <option value="" disabled selected>책을 고르세요</option>
                    <option th:each="b : ${books}" th:value="${b.id}" th:text="${b.title}">책 제목</option>
                </select>
            </div>
            <div class="field">
                <label for="date">읽은 날짜</label>
                <input type="date" id="date" name="date"
                       th:value="${selectedDate}" th:min="${minDate}" th:max="${today}" required>
                <span class="field-hint muted">최근 7일 이내의 빠뜨린 날을 채울 수 있어요(미래·7일 이전은 불가).</span>
            </div>
            <div class="field">
                <label for="hours">읽은 시간 (시간)</label>
                <input type="number" id="hours" name="hours" min="0" max="24" value="0" inputmode="numeric">
            </div>
            <div class="field">
                <label for="minutes">읽은 시간 (분)</label>
                <input type="number" id="minutes" name="minutes" min="0" max="59" value="0" inputmode="numeric">
            </div>
            <button type="submit" class="btn-primary">기록 추가</button>
        </form>

        <p class="status-line muted" th:if="${books.isEmpty()}">
            <a th:href="@{/books}">먼저 책장에 책을 추가</a>하면 그 책으로 빠뜨린 독서를 기록할 수 있어요.
        </p>
    </section>

    <nav class="link-row" aria-label="페이지 이동">
        <th:block th:replace="~{fragments/nav-links :: navLink(@{/}, 'home', '홈')}"></th:block>
        <th:block th:replace="~{fragments/nav-links :: navLink(@{/history}, 'history', '독서 기록')}"></th:block>
        <th:block th:replace="~{fragments/nav-links :: navLink(@{/books}, 'books', '내 책장')}"></th:block>
    </nav>
</div>
</body>
</html>
