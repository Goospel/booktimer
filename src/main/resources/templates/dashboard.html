<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/theme-head :: boot}"></th:block>
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <th:block th:replace="~{fragments/pwa-head :: meta}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <title>홈 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block th:replace="~{ads :: loader}"></th:block>
</head>
<body class="dashboard-page">
<div class="container">
    <header class="brand">
        <a class="brand-home" th:href="@{/}" title="홈으로">
            <svg class="brand-ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="3.4" height="16" rx="1"/><rect x="9.3" y="4" width="3.4" height="16" rx="1"/><path d="M15 5.4l3.3-.7 2.4 15.4-3.3.7z"/></svg>
            <h1>BookTimer</h1>
        </a>
    </header>
    <!-- 온보딩 직후 GET / 은 justOnboarded 플래시를 받아 data 속성으로 심는다(1회). Vue가 읽어 환영 배너(§6.4). -->
    <div id="dashboard-app" th:attr="data-just-onboarded=${justOnboarded}">불러오는 중…</div>
    <!-- 명언 슬롯 — Vue(BrandQuote)가 Teleport로 채움. 발밑 배치(발견 2: 상단 정리 — 격언을 대시보드 맨 아래로).
         header 밖 — 공유 .brand는 무변경. 홈 전용(다른 페이지엔 이 슬롯 자체가 없음 → 영향 0) -->
    <div id="brand-quote-slot" class="brand-quote-slot"></div>
    <noscript><p class="status-line">JavaScript가 필요합니다.</p></noscript>
    <div th:replace="~{ads :: unit}"></div>
</div>
<script type="module" th:attr="nonce=${cspNonce}" th:src="@{/dashboard/dashboard.js}"></script>
</body>
</html>
