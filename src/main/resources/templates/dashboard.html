<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <th:block th:replace="~{fragments/pwa-head :: meta}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <title>대시보드 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block th:replace="~{ads :: loader}"></th:block>
</head>
<body class="dashboard-page">
<div class="container">
    <header class="brand">
        <a class="brand-home" th:href="@{/}" title="메인 대시보드로">
            <span class="emoji">📚</span>
            <h1>BookTimer</h1>
        </a>
    </header>
    <!-- 정원 패널 무대의 SVG 작가 캐릭터(<use href="#sprite-{code}">)가 참조할 심볼 정의.
         Vue 마운트 전에 DOM에 존재하도록 #dashboard-app 앞에 둔다(화면 밖 svg width=0). -->
    <th:block th:replace="~{fragments/garden-character-sprites :: sprites}"></th:block>
    <div id="dashboard-app">불러오는 중…</div>
    <noscript><p class="status-line">JavaScript가 필요합니다.</p></noscript>
    <div th:replace="~{ads :: unit}"></div>
</div>
<script type="module" th:src="@{/dashboard/dashboard.js}"></script>
</body>
</html>
