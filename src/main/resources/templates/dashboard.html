<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>대시보드 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!-- htmx: 폼을 AJAX로 보내 라이브 영역만 swap (전체 리로드 없음) -->
    <script defer src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
    <!-- defer: 문서 순서 보존 → dashboard.js(전역 함수)가 Alpine보다 먼저 평가됨 -->
    <script defer th:src="@{/js/dashboard.js}"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body>
<div class="container">
    <header class="brand">
        <span class="emoji">📚</span>
        <h1>BookTimer</h1>
    </header>
    <p class="greeting"><span th:text="${nickname}">닉네임</span>님, 환영합니다.</p>

    <!-- 라이브 영역: start/stop 시 htmx가 이 div(outerHTML)만 프래그먼트로 교체.
         같은 fragment("dashboard :: live")를 ReadingSessionController가 반환한다. -->
    <div id="dashboard-live" th:fragment="live">
        <div th:if="${error}" class="alert alert-error" th:text="${error}">에러 메시지</div>

        <!-- 타이머 카드: 서버 값은 data-* 로 주입, Alpine이 1초마다 갱신 -->
        <section class="card timer-card"
                 x-data="readingTimer()"
                 th:attr="data-active=${hasActiveSession},data-started=${activeStartedAt},data-remaining=${remainingSeconds}">
            <h2>남은 독서 시간</h2>
            <p class="timer-display"
               :class="{ met: goalMet }"
               x-text="fmt(remainingNow)">00:00:00</p>

            <p class="timer-sub" x-show="active" x-cloak>
                이번 측정 경과 <span class="mono" x-text="fmt(elapsed)">00:00:00</span>
            </p>
            <span class="goal-badge" x-show="goalMet" x-cloak>오늘 목표 달성! 🎉</span>

            <!-- 누적 상한 도달: 서버가 판단(atCap), 더는 쌓이지 않음을 안내 -->
            <p class="cap-badge" th:if="${atCap}">
                ⚠️ 누적 상한에 도달했어요. 더는 쌓이지 않지만, 지금 읽어 따라잡아 보세요.
            </p>
        </section>

        <!-- 측정 상태 + start/stop. hx-post로 무리로드, JS 없으면 일반 form POST(redirect)로 폴백 -->
        <section class="card">
            <h2>측정</h2>
            <div th:if="${hasActiveSession}">
                <p class="status-line">측정 진행 중 · 시작
                    <span class="mono" th:text="${activeStartedAt}">-</span>
                </p>
                <form th:action="@{/sessions/stop}" method="post"
                      hx-post="/sessions/stop" hx-target="#dashboard-live" hx-swap="outerHTML">
                    <button type="submit" class="btn-danger">측정 종료</button>
                </form>
            </div>
            <div th:unless="${hasActiveSession}">
                <p class="status-line">진행 중인 측정이 없습니다.</p>
                <form th:action="@{/sessions/start}" method="post"
                      hx-post="/sessions/start" hx-target="#dashboard-live" hx-swap="outerHTML">
                    <button type="submit" class="btn-primary">측정 시작</button>
                </form>
            </div>
        </section>
    </div>

    <p class="link-row">
        <a th:href="@{/books}">📚 내 책장</a>
        <a th:href="@{/history}">📖 독서 기록</a>
        <a th:href="@{/settings}">⚙️ 설정</a>
    </p>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn-ghost">로그아웃</button>
    </form>
</div>

<style>[x-cloak] { display: none !important; }</style>
</body>
</html>
