<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <th:block th:replace="~{fragments/pwa-head :: meta}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <!-- CSRF 토큰 — 먹이주기 fetch(POST /api/garden/feed)가 X-CSRF-TOKEN 헤더로 싣는다. -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <title>나의 서재 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block th:replace="~{ads :: loader}"></th:block>
</head>
<body>
<!-- 작가 캐릭터 SVG 스프라이트 정의 — 돌봄 뷰 히어로·식구 카드(이모지 폴백). -->
<th:block th:replace="~{fragments/garden-character-sprites :: sprites}"></th:block>

<!-- Vue SPA 마운트 포인트 — 닉네임은 data-nickname으로 전달. -->
<div id="village-app"
     th:attr="data-nickname=${nickname}">불러오는 중…</div>

<script type="module" th:attr="nonce=${cspNonce}" th:src="@{/garden/garden.js}"></script>
</body>
</html>
