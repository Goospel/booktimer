<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <th:block th:replace="~{fragments/pwa-head :: meta}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <!-- CSRF 토큰 — 배치 저장 fetch(POST /api/garden/layout)가 X-CSRF-TOKEN 헤더로 싣는다. -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <!-- VAPID 공개키 — Vue 푸시 토글이 pushManager.subscribe()의 applicationServerKey로 사용 -->
    <meta name="vapid-public-key" th:content="${vapidPublicKey}">
    <title>독서 마을 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block th:replace="~{ads :: loader}"></th:block>
    <script defer src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.4/dist/htmx.min.js"></script>
</head>
<body>
<!-- 식물 SVG 스프라이트 정의 — 화면 밖 <symbol>들을 1회 주입, Vue가 <use href="#sprite-{code}">로 참조. -->
<th:block th:replace="~{fragments/garden-sprites :: sprites}"></th:block>
<!-- 소품 SVG 스프라이트 정의 — 길·연못·울타리 등 13종. -->
<th:block th:replace="~{fragments/garden-decor-sprites :: sprites}"></th:block>
<!-- 작가 캐릭터 SVG 스프라이트 정의 — 배회 작가(이모지 폴백). -->
<th:block th:replace="~{fragments/garden-character-sprites :: sprites}"></th:block>
<!-- 출판사 건물 SVG 스프라이트 정의 — 아이소 건물(이모지 폴백). -->
<th:block th:replace="~{fragments/garden-building-sprites :: sprites}"></th:block>

<!-- Vue SPA 마운트 포인트 — 닉네임은 data-nickname으로 실어 Vue가 HUD에서 읽는다. -->
<div id="village-app" th:attr="data-nickname=${nickname}">불러오는 중…</div>

<script type="module" th:src="@{/garden/garden.js}"></script>
</body>
</html>
