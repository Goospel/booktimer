<!DOCTYPE html>
<!--
  마을 출판사 건물 SVG 스프라이트 정의 — 코드 벡터(외부 에셋 0).

  식물 스프라이트(garden-sprites.html)와 같은 패턴 — 화면 밖 <svg>에 건물을
  <symbol id="sprite-{code}">로 1회 정의하고, 캔버스(Phaser)·도감(Vue)이 <use>·텍스처로 참조한다.
  건물은 도메인상 PlacementAxis.BUILDING 식물로 취급 → spawnObject isPlant=true(발밑 앵커) 경로.
  sprite_id가 null인 건물은 뷰가 이모지로 폴백하므로 여기 없어도 정상이다(미승격 종 혼재 무해).

  모든 심볼 viewBox 0 0 32 32. **발밑 footprint(밑면 다이아)를 타일에 flush로 앉힌다** — 앞 코너를
  발밑 앵커(x=16, y≈31)에 두고, 밑면 다이아를 아이소 타일 각도(기울기 ≈0.4 = 셀 56×22.5px 정합)로
  벌려 벽이 그 위로 솟게 한다. 아이소 코너뷰 — 두 벽면 명암 + 지붕 윗면 + 간판 띠 + 문·창. 32×32라
  단순 양식화(3면 실루엣·색 구분) 필수. 건물은 캐스트 그림자 없이 footprint로 접지(scene.ts가 건물만
  식물용 발밑 그림자를 생략 — 넓은 박스엔 작은 타원이 '뜬' 인상). 대표 출판사 소수만 고유, 나머지는
  베이스+변형(층수·벽색·지붕형)으로 조합한다(N-080).
-->
<svg th:fragment="sprites" class="garden-sprite-defs" width="0" height="0" aria-hidden="true"
     focusable="false" xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
        <!-- 민음사 — 아이소 코너뷰 석조 건물 + 남색 지붕·간판. 밑면 다이아가 타일에 flush. 파일럿. -->
        <symbol id="sprite-minumsa" viewBox="0 0 32 32">
            <!-- 왼쪽 벽(그늘) — 밑면 앞코너(16,31)→왼코너(3,26), 타일 각도 0.4 -->
            <path d="M16 31 3 26V13l13 5z" fill="#B58E63"/>
            <!-- 오른쪽 벽(빛) -->
            <path d="M16 31 29 26V13L16 18z" fill="#D4B07C"/>
            <!-- 지붕 윗면(다이아·남색) -->
            <path d="M16 18 3 13 16 8 29 13z" fill="#3B4E72"/>
            <!-- 지붕 음영(왼쪽 절반) -->
            <path d="M16 8 3 13l13 5z" fill="#32436A"/>
            <!-- 간판 띠(오른쪽 벽 상단) -->
            <path d="M16 18 29 13v3l-13 5z" fill="#22324F"/>
            <!-- 간판 띠(왼쪽 벽 상단) -->
            <path d="M16 18 3 13v3l13 5z" fill="#1B283F"/>
            <!-- 문(오른쪽 벽) -->
            <path d="M18.5 30 22.5 28.5v-7l-4 1.5z" fill="#5A3F2A"/>
            <path d="M18.5 23 22.5 21.5v1l-4 1.5z" fill="#7A5638"/>
            <!-- 창(오른쪽 벽) -->
            <path d="M24.5 25 26.5 24v-3l-2 1z" fill="#A7C0CC"/>
            <!-- 창(왼쪽 벽) 2개 -->
            <path d="M6.5 21 9.5 22.2v-3L6.5 18z" fill="#94B0BE"/>
            <path d="M11 23.4 14 24.6v-3l-3-1.2z" fill="#94B0BE"/>
        </symbol>
    </defs>
</svg>
