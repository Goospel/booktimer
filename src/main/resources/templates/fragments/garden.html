<!DOCTYPE html>
<!--
  독서 정원(베타) 요약 fragment — 대시보드 잔디 카드 안 접힌 <details>로 싣는다.

  전체 도감(시간·장르·레시피 3축 그리드)은 전용 페이지 /garden(templates/garden.html)으로 이전됐고,
  대시보드에는 이 경량 요약만 남긴다 — 미니 정원(보유 식물) + 3축 진척 한 줄 + "정원 도감 →" 링크.
  카드를 가볍게 해 대시보드 비대화를 막고, 깊은 도감 탐색은 전용 페이지로 분리한다(계획 §0.1).

  순수 CSS <details>/<summary>로 토글(JS 0). 처음엔 접혀(베타라 opt-in) 잔디만 보이고, 잔디 카드 제목 옆
  화살표(▸)를 누르면 아래로 펼쳐진다. 토글 인프라(.garden-toggle absolute·.garden-host)는 잔디 레이아웃과
  맞물려 있어 그대로 유지한다(잔디 회귀 0). 발견 토스트는 발견 평가가 대시보드 진입 때 일어나므로 여기 둔다.

  PlantState/GardenView는 record라 메서드 호출 구문으로, Plant는 JPA 엔티티라 getter로 읽는다.
-->
<html xmlns:th="http://www.thymeleaf.org">
<body>
<details class="garden" th:fragment="summary(garden)">
    <summary class="garden-toggle">
        <span class="garden-toggle-label">정원</span>
        <span class="garden-arrow" aria-hidden="true">▸</span>
    </summary>

    <div class="garden-panel">
        <p class="garden-beta">🚧 베타 · 정원은 개발 중이에요. 곧 더 다양한 식물로 채워집니다.</p>

        <!-- 발견 토스트: 이번 조회에서 새로 발견된 숨은 레시피 식물을 알린다(저장된 발견 이벤트, 트랙 B). -->
        <p class="garden-toast" th:if="${!garden.justDiscovered().isEmpty()}"
           th:text="'🎉 새 식물 발견! ' + ${#strings.listJoin(garden.justDiscovered(), ', ')}">🎉 새 식물 발견!</p>

        <!-- 미니 정원: 보유한 시간축 식물만(전체 도감은 /garden으로 이전) -->
        <div class="garden-mine" th:if="${garden.ownedCount() > 0}">
            <th:block th:each="p : ${garden.plants()}" th:if="${p.owned()}">
                <span class="plant-cell owned" th:title="${p.plant().getName()}">
                    <span class="plant-emoji" th:text="${p.plant().getEmoji()}">🌱</span>
                </span>
            </th:block>
        </div>
        <p class="garden-empty" th:unless="${garden.ownedCount() > 0}">
            아직 심은 식물이 없어요. 오늘 목표를 채워 첫 새싹을 심어보세요 🌱
        </p>

        <!-- 3축 진척 한 줄(시간·장르·레시피 합산) — 한눈에 수집 현황. 깊은 도감은 전용 페이지로. -->
        <p class="garden-summary-progress"
           th:text="'⏳ 시간 ' + ${garden.ownedCount()} + '/' + ${garden.totalCount()}
               + ' · 🌸 장르 ' + ${garden.ownedGenreCount()} + '/' + ${garden.totalGenreCount()}
               + ' · 🔍 레시피 ' + (${garden.recipePlants().size()} - ${garden.mysterySlotCount()}) + '/' + ${garden.recipePlants().size()} + ' 발견'">
            ⏳ 시간 0/14 · 🌸 장르 0/13 · 🔍 레시피 0/8 발견</p>

        <!-- 전체 도감(축 탭·보유/미보유 필터) 전용 페이지로 -->
        <a class="garden-dex-link" th:href="@{/garden}">🌱 정원 도감 보기 →</a>
    </div>
</details>
</body>
</html>
