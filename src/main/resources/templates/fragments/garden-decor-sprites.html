<!DOCTYPE html>
<!--
  독서 정원 꾸미기 소품 SVG 스프라이트 정의(Phase 3) — 코드 벡터(외부 에셋 0).

  식물 스프라이트(garden-sprites.html)와 같은 패턴 — 화면 밖 <svg>에 소품 13종을 <symbol id="sprite-{code}">로
  1회 정의하고, 캔버스·도감·팔레트가 <use href="#sprite-{code}">로 N곳에서 참조한다. 소품 code는 식물 47종과
  전역 유니크라(다른 네임스페이스 공유) 충돌 0. spriteId가 없는 소품은 뷰가 이모지로 폴백한다.

  소품은 식물과 달리 sway 하지 않으므로(연못이 흔들리면 어색) 보기 뷰가 .canvas-decor로 감싼다. 모든 심볼
  viewBox 0 0 32 32, 가운데(x=16)·바닥쪽(y≈26) 기준. 무대(잔디 세이지·흙 갈색)와 어울리는 채도 낮은 톤. fill 명시.
-->
<svg th:fragment="sprites" class="garden-sprite-defs" width="0" height="0" aria-hidden="true"
     focusable="false" xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden">
    <defs>
        <!-- 돌길 — 굽이진 디딤돌 세 장 -->
        <symbol id="sprite-stone_path" viewBox="0 0 32 32">
            <ellipse cx="11" cy="24" rx="7" ry="3.2" fill="#A9A99F"/>
            <ellipse cx="20" cy="19" rx="6" ry="2.8" fill="#B7B7AD"/>
            <ellipse cx="13" cy="14.5" rx="5" ry="2.4" fill="#A9A99F"/>
            <ellipse cx="11" cy="24" rx="7" ry="3.2" fill="none" stroke="#8C8C82" stroke-width="0.7"/>
        </symbol>

        <!-- 디딤돌 — 납작한 둥근 돌 하나 -->
        <symbol id="sprite-stepping_stone" viewBox="0 0 32 32">
            <ellipse cx="16" cy="22" rx="10" ry="5" fill="#B7B7AD"/>
            <ellipse cx="16" cy="20.6" rx="8" ry="3.6" fill="#C6C6BC"/>
            <ellipse cx="16" cy="22" rx="10" ry="5" fill="none" stroke="#8C8C82" stroke-width="0.7"/>
        </symbol>

        <!-- 연못 — 잔디 가장자리 + 물 + 윤슬 -->
        <symbol id="sprite-pond" viewBox="0 0 32 32">
            <ellipse cx="16" cy="22" rx="12" ry="6.8" fill="#86A56B"/>
            <ellipse cx="16" cy="22" rx="10" ry="5.4" fill="#7FAFCF"/>
            <ellipse cx="13" cy="20.4" rx="3.4" ry="1.3" fill="#A9CCE0"/>
        </symbol>

        <!-- 분수 — 받침 + 물기둥 + 물줄기 -->
        <symbol id="sprite-fountain" viewBox="0 0 32 32">
            <ellipse cx="16" cy="25" rx="10" ry="4.4" fill="#A9A99F"/>
            <ellipse cx="16" cy="24" rx="8" ry="3.1" fill="#7FAFCF"/>
            <rect x="14.5" y="13" width="3" height="10" rx="1.2" fill="#B7B7AD"/>
            <ellipse cx="16" cy="13" rx="4" ry="1.5" fill="#9A9A92"/>
            <path d="M16 11.5c-1.4 1.4-2.8 2.4-2.8 4M16 11.5c1.4 1.4 2.8 2.4 2.8 4" stroke="#A9CCE0" stroke-width="1.1" fill="none" stroke-linecap="round"/>
        </symbol>

        <!-- 나무 울타리 — 두 기둥 + 두 가로대 -->
        <symbol id="sprite-wood_fence" viewBox="0 0 32 32">
            <rect x="6" y="12" width="3" height="15" rx="1" fill="#A9763F"/>
            <rect x="23" y="12" width="3" height="15" rx="1" fill="#A9763F"/>
            <rect x="5" y="16" width="22" height="2.6" rx="1" fill="#C28A50"/>
            <rect x="5" y="21" width="22" height="2.6" rx="1" fill="#C28A50"/>
        </symbol>

        <!-- 돌담 — 어긋쌓기 벽돌 두 단 -->
        <symbol id="sprite-stone_wall" viewBox="0 0 32 32">
            <g fill="#B7B7AD" stroke="#8C8C82" stroke-width="0.6">
                <rect x="5" y="17.5" width="7" height="5" rx="1"/>
                <rect x="13" y="17.5" width="7" height="5" rx="1"/>
                <rect x="21" y="17.5" width="6" height="5" rx="1"/>
                <rect x="3.5" y="23" width="4" height="5" rx="1"/>
                <rect x="8.5" y="23" width="7" height="5" rx="1"/>
                <rect x="16.5" y="23" width="7" height="5" rx="1"/>
                <rect x="24.5" y="23" width="4" height="5" rx="1"/>
            </g>
        </symbol>

        <!-- 벤치 — 등받이 + 좌판 + 다리 -->
        <symbol id="sprite-bench" viewBox="0 0 32 32">
            <rect x="7" y="11" width="18" height="2.4" rx="1" fill="#C98A5E"/>
            <rect x="8.5" y="13" width="2" height="4.5" fill="#A9763F"/>
            <rect x="21.5" y="13" width="2" height="4.5" fill="#A9763F"/>
            <rect x="6.5" y="17" width="19" height="3.2" rx="1" fill="#B5774C"/>
            <rect x="9" y="20" width="2.4" height="6" fill="#8A5E3C"/>
            <rect x="20.6" y="20" width="2.4" height="6" fill="#8A5E3C"/>
        </symbol>

        <!-- 우물 — 돌 몸통 + 물 + 지붕 -->
        <symbol id="sprite-well" viewBox="0 0 32 32">
            <path d="M16 6 7 11h18z" fill="#A9763F"/>
            <rect x="9.5" y="10" width="2" height="10" fill="#8A5E3C"/>
            <rect x="20.5" y="10" width="2" height="10" fill="#8A5E3C"/>
            <rect x="9" y="19.5" width="14" height="7.5" rx="1.5" fill="#A9A99F"/>
            <ellipse cx="16" cy="19.8" rx="7" ry="2.2" fill="#7FAFCF"/>
            <ellipse cx="16" cy="19.8" rx="7" ry="2.2" fill="none" stroke="#8C8C82" stroke-width="0.7"/>
        </symbol>

        <!-- 등불 — 기둥 + 등 + 불빛 -->
        <symbol id="sprite-lantern" viewBox="0 0 32 32">
            <rect x="14.6" y="15" width="2.8" height="12" rx="1" fill="#6E6E66"/>
            <rect x="11.5" y="8.5" width="9" height="8" rx="1.4" fill="#7A7A70"/>
            <rect x="13" y="10" width="6" height="5" rx="0.8" fill="#F3D9A0"/>
            <rect x="12" y="6.6" width="8" height="2.2" rx="1" fill="#6E6E66"/>
            <rect x="13.5" y="26" width="5" height="1.6" rx="0.8" fill="#6E6E66"/>
        </symbol>

        <!-- 표지판 — 기둥 + 화살 팻말 -->
        <symbol id="sprite-signpost" viewBox="0 0 32 32">
            <rect x="14.6" y="11" width="2.6" height="16" rx="1" fill="#8A5E3C"/>
            <path d="M15 10.5h10l3 3-3 3H15z" fill="#C28A50" stroke="#A9763F" stroke-width="0.6"/>
        </symbol>

        <!-- 바위 — 둥근 화강암 + 윤곽 + 하이라이트 -->
        <symbol id="sprite-rock" viewBox="0 0 32 32">
            <path d="M6 25c-1-5 3-9 7-9 5 0 9 2 10 6 0.8 3-1 4-4 4H9c-2 0-2.6-0.6-3-1z" fill="#A7A79D"/>
            <path d="M13 16.5c2 1 3.2 3 3.2 6.2" stroke="#8C8C82" stroke-width="1" fill="none" stroke-linecap="round"/>
            <ellipse cx="11" cy="19" rx="2.4" ry="1.3" fill="#BCBCB2"/>
        </symbol>

        <!-- 그루터기 — 나이테 단면 + 몸통 -->
        <symbol id="sprite-stump" viewBox="0 0 32 32">
            <path d="M10 16h12v9c0 1.4-2.7 2.4-6 2.4s-6-1-6-2.4z" fill="#9A6B43"/>
            <ellipse cx="16" cy="16" rx="6" ry="2.6" fill="#B5824F"/>
            <ellipse cx="16" cy="16" rx="3.6" ry="1.5" fill="none" stroke="#9A6B43" stroke-width="0.8"/>
            <ellipse cx="16" cy="16" rx="1.5" ry="0.6" fill="#7E5634"/>
        </symbol>

        <!-- 버섯 무리 — 큰 버섯 + 작은 버섯 -->
        <symbol id="sprite-mushrooms" viewBox="0 0 32 32">
            <rect x="13.5" y="18" width="3" height="8" rx="1.4" fill="#EDE3D6"/>
            <path d="M8 19c0-4 3.2-6.2 7-6.2s7 2.2 7 6.2z" fill="#C0654F"/>
            <circle cx="12.5" cy="16.6" r="1" fill="#F2E6DD"/>
            <circle cx="17.5" cy="16" r="1.2" fill="#F2E6DD"/>
            <rect x="22" y="21.5" width="2.2" height="5" rx="1" fill="#EDE3D6"/>
            <path d="M18.6 21.8c0-2.3 1.7-3.5 3.5-3.5s3.5 1.2 3.5 3.5z" fill="#C77B6B"/>
        </symbol>
    </defs>
</svg>
