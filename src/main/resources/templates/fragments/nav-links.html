<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  하단 네비 버튼 하나(타일) — 양옆 세로 바(fragments/side-rails)가 없는 SSR 화면(에러·약관·비밀번호 찾기·관리자)이
  공유하는 단일 출처. 로그인 사용자 화면의 이동은 양옆 바가 맡는다(2026-09-15). 호출:
    <nav class="link-row" aria-label="페이지 이동">
      <th:block th:replace="~{fragments/nav-links :: navLink(@{/}, 'home', '홈')}"></th:block>
      <th:block th:replace="~{fragments/nav-links :: navLink(@{/history}, 'history', '독서 기록')}"></th:block>
    </nav>
  href 는 호출부가 @{...} 로 평가해 넘긴다. 링크 수가 홀수면 마지막이 전체폭(.link-row CSS).
-->
<a th:fragment="navLink(href, icon, label)" th:href="${href}">
    <th:block th:replace="~{fragments/nav-icons :: icon(${icon})}"></th:block>
    <span th:text="${label}"></span>
</a>
</body>
</html>
