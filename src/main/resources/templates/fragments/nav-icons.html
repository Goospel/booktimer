<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  하단 네비 라인 아이콘 — SSR(Thymeleaf) 단일 출처. Vue의 frontend/src/shared/navIcons.ts 와
  같은 path 데이터를 유지한다(두 런타임이라 물리적으로는 둘이지만 값은 동기화 — 한쪽 수정 시
  반드시 다른 쪽도). 색은 app.css 의 .link-row a svg.link-ico { color: accent-hover } 가
  대시보드 타일과 통일한다. name 별 inner SVG 분기.
-->
<svg th:fragment="icon(name)" class="link-ico" width="18" height="18" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" th:switch="${name}">
    <th:block th:case="'home'"><path d="M4 11l8-6 8 6"/><path d="M6 10v9h12v-9"/></th:block>
    <th:block th:case="'back'"><path d="M20 12H4"/><path d="M10 6l-6 6 6 6"/></th:block>
    <th:block th:case="'books'"><rect x="4" y="4" width="3.4" height="16" rx="1"/><rect x="9.3" y="4" width="3.4" height="16" rx="1"/><path d="M15 5.4l3.3-.7 2.4 15.4-3.3.7z"/></th:block>
    <th:block th:case="'history'"><path d="M3 20h18"/><path d="M6 20v-6"/><path d="M12 20V6"/><path d="M18 20v-9"/></th:block>
    <th:block th:case="'search'"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></th:block>
    <th:block th:case="'user'"><circle cx="12" cy="8" r="3.6"/><path d="M5 20a7 7 0 0 1 14 0"/></th:block>
    <th:block th:case="'personality'"><path d="M7 4c0 5 10 5 10 8s-10 3-10 8"/><path d="M17 4c0 5-10 5-10 8s10 3 10 8"/><path d="M8.5 7h7"/><path d="M8.5 17h7"/></th:block>
    <th:block th:case="'block'"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></th:block>
    <th:block th:case="'report'"><path d="M5 21V4"/><path d="M5 5h11l-2 3 2 3H5"/></th:block>
    <th:block th:case="'follow'"><circle cx="10" cy="8" r="3.4"/><path d="M4 20a6 6 0 0 1 12 0"/><path d="M19 8v6M16 11h6"/></th:block>
    <th:block th:case="'privacy'"><path d="M12 3l7 2.6v5.4c0 4.2-2.9 7.2-7 8.5-4.1-1.3-7-4.3-7-8.5V5.6z"/></th:block>
    <th:block th:case="'quote'"><path d="M7 7c-1.7 0-3 1.3-3 3s1.3 3 3 3c0 1.6-1 2.6-2.6 3.1"/><path d="M17 7c-1.7 0-3 1.3-3 3s1.3 3 3 3c0 1.6-1 2.6-2.6 3.1"/></th:block>
    <th:block th:case="'feedback'"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5v7a1.5 1.5 0 0 1-1.5 1.5H9l-5 4z"/></th:block>
    <th:block th:case="'users'"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><path d="M16 5.4a3 3 0 0 1 0 5.2"/><path d="M17.5 13.2A5.5 5.5 0 0 1 20.5 19"/></th:block>
    <th:block th:case="'lock'"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></th:block>
</svg>
</body>
</html>
