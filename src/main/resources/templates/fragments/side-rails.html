<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  양옆 세로 바(side rails) — 로그인 사용자 화면의 페이지 이동 단일 출처.
  설계: claude-docs/plans/2026-09-15-web-side-rails.md. 호출(페이지 <body class="has-rails"> 바로 다음 줄):
    <th:block th:replace="~{fragments/side-rails :: rails}"></th:block>

  - rail(RailModelAdvice)이 활성 메뉴·모드·내 책방 href를 준다. 미인증이면 null이라 통째로 안 그린다.
  - data-mode = 지금 모드(반대쪽 바를 흐린다). 서버는 경로로 그리고, 홈만 아래 인라인 부트가 저장값으로,
    홈 Vue가 모드 토글마다 같은 속성을 덮는다(timerMode.ts syncRailMode).
  - 홈 항목은 없다 — 로고(a.brand-home)가 모든 화면의 홈 링크다(설계 2026-09-16-rail-home-entry).
  - data-remember = 홈이 열릴 모드(rail.js가 저장). 활성 키 있는 비홈 페이지에만 나온다 — 중립 화면은
    경로상 reading이라 무조건 쓰면 「공부 모드 → 설정 → 로고 → 독서 타이머」로 튄다. null이면 th:attr가 안 그린다.
  - 접힘/펼침·태블릿 탭·Esc는 /js/rail.js. JS가 없어도 링크는 전부 동작한다.
-->
<th:block th:fragment="rails" th:if="${rail != null}">
<div id="side-rails" th:attr="data-mode=${rail.mode},data-remember=${rail.rememberMode}">
    <aside class="rail rail-reading">
        <nav aria-label="독서 이동">
            <span class="rail-pill">독서</span>
            <a class="rail-item" th:href="@{/books}" th:aria-current="${rail.activeKey == 'books'} ? 'page' : null"><th:block th:replace="~{fragments/nav-icons :: icon('books')}"></th:block><span>내 책장</span></a>
            <a class="rail-item" th:if="${rail.shopHref != null}" th:href="@{${rail.shopHref}}" th:aria-current="${rail.activeKey == 'shop'} ? 'page' : null"><th:block th:replace="~{fragments/nav-icons :: icon('user')}"></th:block><span>내 책방</span></a>
            <a class="rail-item" th:href="@{/personality}" th:aria-current="${rail.activeKey == 'personality'} ? 'page' : null"><th:block th:replace="~{fragments/nav-icons :: icon('personality')}"></th:block><span>책BTI</span></a>
            <a class="rail-item" th:href="@{/history}" th:aria-current="${rail.activeKey == 'history'} ? 'page' : null"><th:block th:replace="~{fragments/nav-icons :: icon('history')}"></th:block><span>독서 기록</span></a>
            <a class="rail-item" th:href="@{/search}" th:aria-current="${rail.activeKey == 'search'} ? 'page' : null"><th:block th:replace="~{fragments/nav-icons :: icon('search')}"></th:block><span>사용자 검색</span></a>
        </nav>
    </aside>
    <aside class="rail rail-study is-study">
        <nav aria-label="공부 이동">
            <span class="rail-pill">공부</span>
            <a class="rail-item" th:href="@{/study}" th:aria-current="${rail.activeKey == 'plan'} ? 'page' : null"><th:block th:replace="~{fragments/nav-icons :: icon('calendar')}"></th:block><span>일정</span></a>
            <a class="rail-item" th:href="@{/study/recall}" th:aria-current="${rail.activeKey == 'recall'} ? 'page' : null"><th:block th:replace="~{fragments/nav-icons :: icon('note')}"></th:block><span>백지노트</span></a>
            <a class="rail-item" th:href="@{/study/books}" th:aria-current="${rail.activeKey == 'sbooks'} ? 'page' : null"><th:block th:replace="~{fragments/nav-icons :: icon('books')}"></th:block><span>공부 서재</span></a>
            <a class="rail-item" th:href="@{/study/history}" th:aria-current="${rail.activeKey == 'shistory'} ? 'page' : null"><th:block th:replace="~{fragments/nav-icons :: icon('history')}"></th:block><span>공부 기록</span></a>
        </nav>
    </aside>
</div>
<!-- 홈만: 저장 모드를 첫 페인트 전에 반영(theme-head :: boot와 같은 이유 — 서버는 경로만 알고 저장값은 모른다).
     같은 태그 안에서 독서등 힌트도 붙인다(공부 측정 중 새로고침의 낮→밤 깜빡임 방지 — 서버 응답 뒤 Vue가 진실로 덮는다).
     주의 — 램프 힌트가 켜졌으면 모드 힌트가 reading이어도 data-mode를 study로 세운다. 공부 측정 중에 왼쪽 바를
     들르면 저장 모드가 reading이 되고, 그 뒤 홈에 오면 밤 배경에 독서 바가 선명한 구간이 응답 전까지 남기 때문.
     램프가 켜졌다는 건 공부 세션 진행 중이라는 뜻이고 effectiveMode가 낼 최종 값도 study라 여기서 미리 맞춘다.
     램프 힌트가 낡았을 수 있지만 그 경우는 지금도 배경이 이미 틀리게 뜨므로 이 변경이 더 나쁘게 만들지 않는다.
     리터럴 'booktimer.timerMode'·'booktimer.studyLamp'·'study-lamp'는 timerMode.ts와 따로 적힌다 — 동기는 timer-mode.test.ts가 지킨다. -->
<script th:if="${rail.activeKey == 'home'}" th:attr="nonce=${cspNonce}">try{var l=localStorage.getItem('booktimer.studyLamp')==='1';if(localStorage.getItem('booktimer.timerMode')==='study'||l)document.getElementById('side-rails').dataset.mode='study';if(l)document.body.classList.add('study-lamp')}catch(e){}</script>
<script type="module" th:attr="nonce=${cspNonce}" th:src="@{/js/rail.js}"></script>
</th:block>
</body>
</html>
