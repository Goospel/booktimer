<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <style>
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.75rem;
            margin-top: 0.5rem;
        }
        .stat {
            border: 1px solid rgba(0, 0, 0, 0.08);
            border-radius: 10px;
            padding: 0.85rem 1rem;
            background: rgba(0, 0, 0, 0.02);
        }
        .stat .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.2;
        }
        .stat .stat-label {
            font-size: 0.8rem;
            opacity: 0.7;
            margin-top: 0.2rem;
        }
    </style>
</head>
<body>
<div class="container">
    <header class="brand">
        <span class="emoji">🛠️</span>
        <h1>BookTimer 관리자</h1>
    </header>
    <p class="greeting"><span th:text="${nickname}">운영자</span>님 — 운영 데이터 확인 화면입니다.</p>

    <section class="card">
        <h2>통계 요약</h2>
        <p class="status-line muted">읽기 전용 집계 — 가입자(운영자 제외)·활성·독서 기록 현황.</p>
        <div class="stat-grid">
            <div class="stat">
                <div class="stat-value" th:text="${stats.totalUsers}">0</div>
                <div class="stat-label">가입자 (USER)</div>
            </div>
            <div class="stat">
                <div class="stat-value" th:text="${stats.onboardedUsers}">0</div>
                <div class="stat-label">온보딩 완료</div>
            </div>
            <div class="stat">
                <div class="stat-value" th:text="${stats.activeUsers}">0</div>
                <div class="stat-label">최근 <span th:text="${stats.activeWindowDays}">7</span>일 활성</div>
            </div>
            <div class="stat">
                <div class="stat-value" th:text="${stats.totalBooks}">0</div>
                <div class="stat-label">등록된 책</div>
            </div>
            <div class="stat">
                <div class="stat-value" th:text="${stats.totalSessions}">0</div>
                <div class="stat-label">측정 세션</div>
            </div>
            <div class="stat">
                <div class="stat-value"
                     th:text="|${stats.totalReadingSeconds / 3600}시간 ${(stats.totalReadingSeconds % 3600) / 60}분|">0시간 0분</div>
                <div class="stat-label">총 독서 시간</div>
            </div>
            <div class="stat">
                <div class="stat-value"
                     th:text="|${stats.avgReadingSecondsPerUser / 3600}시간 ${(stats.avgReadingSecondsPerUser % 3600) / 60}분|">0시간 0분</div>
                <div class="stat-label">가입자당 평균</div>
            </div>
        </div>
    </section>

    <section class="card">
        <h2>데이터 조회</h2>
        <p class="status-line muted">사용자 목록·드릴다운(타이머·세션·책장). 개인정보 최소 노출 — email 마스킹.</p>
        <p class="link-row">
            <a th:href="@{/admin/users}">👥 사용자 목록 →</a>
        </p>
    </section>

    <section class="card">
        <h2>콘텐츠 관리</h2>
        <p class="status-line muted">대시보드 인사말 자리에 랜덤 노출되는 작가 격언을 추가·삭제.</p>
        <p class="link-row">
            <a th:href="@{/admin/quotes}">📝 격언 관리 →</a>
        </p>
    </section>

    <p class="link-row">
        <a th:href="@{/}">← 대시보드</a>
    </p>

    <!-- 로그아웃은 일반 대시보드와 동일하게 화면 최하단에 둔다(상단 노출 방지). -->
    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn-ghost">로그아웃</button>
    </form>
</div>
</body>
</html>
