<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 방문 통계(GA4, 측정 ID 설정 시에만) -->
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 재설정 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <header class="brand">
        <span class="emoji">📚</span>
        <h1>BookTimer</h1>
    </header>

    <section class="card">
        <div th:if="${success}">
            <div class="entry-hero">
                <h2>비밀번호가 변경됐어요 🎉</h2>
                <p>새 비밀번호로 로그인해 주세요.</p>
            </div>
            <a class="btn-primary" th:href="@{/login}" style="display:block">로그인하러 가기</a>
        </div>
        <div th:unless="${success}">
            <div class="entry-hero">
                <h2>재설정 링크가 만료됐어요</h2>
                <p>이 재설정 링크는 만료됐거나 이미 사용됐어요. 다시 요청해 주세요.</p>
            </div>
            <a class="btn-primary" th:href="@{/password/forgot}" style="display:block">재설정 다시 요청하기</a>
        </div>
    </section>
</div>
</body>
</html>
