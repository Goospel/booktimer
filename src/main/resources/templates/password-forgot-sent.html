<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 방문 통계(GA4, 측정 ID 설정 시에만) -->
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>재설정 메일 발송 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <header class="brand">
        <svg class="brand-ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="3.4" height="16" rx="1"/><rect x="9.3" y="4" width="3.4" height="16" rx="1"/><path d="M15 5.4l3.3-.7 2.4 15.4-3.3.7z"/></svg>
        <h1>BookTimer</h1>
    </header>

    <section class="card">
        <div class="entry-hero">
            <h2>메일을 확인해 주세요 📬</h2>
            <!-- 열거완화: 계정 존재 여부를 드러내지 않도록 "해당 계정이 있다면"으로 안내한다. -->
            <p>입력하신 주소로 가입된 계정이 있다면, 비밀번호 재설정 링크를 보내드렸어요.
                메일함을 확인해 주세요(링크는 1시간 동안 유효합니다).</p>
        </div>
        <a class="btn-primary" th:href="@{/login}" style="display:block">로그인하러 가기</a>
    </section>
</div>
</body>
</html>
