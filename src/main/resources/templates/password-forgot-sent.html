<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>재설정 메일 발송 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <header class="brand">
        <span class="emoji">📚</span>
        <h1>BookTimer</h1>
    </header>

    <section class="card">
        <div class="entry-hero">
            <h2>메일을 확인해 주세요 📬</h2>
            <!-- 열거완화: 계정 존재 여부를 드러내지 않도록 "해당 계정이 있다면"으로 안내한다. -->
            <p>입력하신 주소로 가입된 계정이 있다면, 비밀번호 재설정 링크를 보내드렸어요.
                메일함을 확인해 주세요(링크는 1시간 동안 유효합니다).</p>
        </div>
        <a class="btn-primary" th:href="@{/login}" style="display:block">로그인하러 가기</a>
    </section>
</div>
</body>
</html>
