<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 방문 통계(GA4, 측정 ID 설정 시에만) -->
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>사용자 검색 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!-- CSRF 토큰 — Vue 섬의 POST /api/follow·/unfollow 헤더로 사용 -->
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <!-- 광고 로더(게시자 ID 설정 시에만) -->
    <th:block th:replace="~{ads :: loader}"></th:block>
</head>
<body>
<div class="container">
    <header class="brand">
        <a class="brand-home" th:href="@{/}" title="홈으로">
            <svg class="brand-ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="3.4" height="16" rx="1"/><rect x="9.3" y="4" width="3.4" height="16" rx="1"/><path d="M15 5.4l3.3-.7 2.4 15.4-3.3.7z"/></svg>
            <h1>BookTimer</h1>
        </a>
    </header>

    <!-- 사용자 검색 greeting은 다른 섬 페이지와 동일하게 Vue(SearchApp.vue page-stack)가 렌더한다 —
         SSR에 또 두면 마운트 후 greeting이 두 번 보인다(브랜드 아래 + 카드 위). -->
    <!-- Vue 섬 마운트 포인트 — data-* 로 초기값 전달 -->
    <div id="search-app"
         th:attr="data-my-login-id=${myLoginId}, data-initial-q=${q != null ? q : ''}">
        불러오는 중…
    </div>
    <noscript>
        <p class="status-line muted">이 페이지는 JavaScript가 필요합니다.</p>
    </noscript>

    <!-- 광고 (하단, 게시자 ID 설정 시에만) -->
    <div th:replace="~{ads :: unit}"></div>
</div>
<!-- Spring resource chain이 런타임에 search-<hash>.js 로 변환 -->
<script type="module" th:attr="nonce=${cspNonce}" th:src="@{/search/search.js}"></script>
</body>
</html>
