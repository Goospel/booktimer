<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>사용자 검색 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!-- 광고 로더(게시자 ID 설정 시에만) -->
    <th:block th:replace="~{ads :: loader}"></th:block>
</head>
<body>
<div class="container">
    <header class="brand">
        <a class="brand-home" th:href="@{/}" title="메인 대시보드로">
            <span class="emoji">📚</span>
            <h1>BookTimer</h1>
        </a>
    </header>
    <p class="greeting">사용자 검색</p>

    <!-- 아이디(@핸들) 검색 -->
    <section class="card">
        <h2>아이디로 찾기</h2>
        <form method="get" th:action="@{/search}" class="book-search-form">
            <input type="text" name="q" th:value="${q}" placeholder="아이디 (2글자 이상)" minlength="2" required>
            <button type="submit" class="btn-primary">검색</button>
        </form>

        <ul class="book-list" th:if="${results != null and !results.isEmpty()}">
            <li class="book-row" th:each="r : ${results}">
                <div class="book-meta">
                    <a class="book-title" th:href="@{/u/{n}(n=${r.loginId})}" th:text="${r.nickname}">닉네임</a>
                    <span class="book-author" th:text="'@' + ${r.loginId} + ' · 공개 책 ' + ${r.publicBookCount} + '권'">@아이디 · 공개 책 0권</span>
                </div>
                <div class="book-actions">
                    <span th:if="${r.self}" class="book-status-badge">나</span>
                    <form th:unless="${r.self}" method="post"
                          th:action="@{${r.following} ? '/unfollow' : '/follow'}">
                        <input type="hidden" name="loginId" th:value="${r.loginId}">
                        <input type="hidden" name="redirect" th:value="@{/search(q=${q})}">
                        <button type="submit"
                                th:classappend="${r.following} ? 'btn-ghost' : 'btn-primary'"
                                th:text="${r.following} ? '언팔로우' : '팔로우'">팔로우</button>
                    </form>
                </div>
            </li>
        </ul>

        <p th:if="${rateLimited}" class="status-line muted">검색이 너무 잦습니다. 잠시 후 다시 시도해 주세요.</p>
        <p th:if="${!rateLimited and q != null and q.trim().length() >= 2 and (results == null or results.isEmpty())}"
           class="status-line muted">검색 결과가 없습니다.</p>
        <p th:if="${!rateLimited and q != null and q.trim().length() < 2}" class="status-line muted">두 글자 이상 입력해 주세요.</p>
    </section>

    <!-- 친구 추천 — 지금은 무작위 N명만 보여준다. (후속: 독서 성향 기반 추천으로 고도화) -->
    <section class="card">
        <h2>친구 추천</h2>
        <p class="status-line muted" th:if="${recommendations == null or recommendations.isEmpty()}">
            아직 추천할 사용자가 없습니다.
        </p>
        <ul class="book-list" th:if="${recommendations != null and !recommendations.isEmpty()}">
            <li class="book-row" th:each="r : ${recommendations}">
                <div class="book-meta">
                    <a class="book-title" th:href="@{/u/{n}(n=${r.loginId})}" th:text="${r.nickname}">닉네임</a>
                    <span class="book-author" th:text="'@' + ${r.loginId} + ' · 공개 책 ' + ${r.publicBookCount} + '권'">@아이디 · 공개 책 0권</span>
                </div>
                <div class="book-actions">
                    <span th:if="${r.self}" class="book-status-badge">나</span>
                    <form th:unless="${r.self}" method="post"
                          th:action="@{${r.following} ? '/unfollow' : '/follow'}">
                        <input type="hidden" name="loginId" th:value="${r.loginId}">
                        <input type="hidden" name="redirect" th:value="@{/search}">
                        <button type="submit"
                                th:classappend="${r.following} ? 'btn-ghost' : 'btn-primary'"
                                th:text="${r.following} ? '언팔로우' : '팔로우'">팔로우</button>
                    </form>
                </div>
            </li>
        </ul>
    </section>

    <!-- 광고 (하단, 게시자 ID 설정 시에만) -->
    <div th:replace="~{ads :: unit}"></div>

    <p class="link-row">
        <a th:href="@{/}">← 대시보드</a>
        <a th:href="@{/u/{n}(n=${myLoginId})}">📖 내 책방</a>
    </p>
</div>
</body>
</html>
