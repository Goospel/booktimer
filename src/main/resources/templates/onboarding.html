<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 방문 통계(GA4, 측정 ID 설정 시에만) -->
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>시작 설정 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <header class="brand">
        <svg class="brand-ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="3.4" height="16" rx="1"/><rect x="9.3" y="4" width="3.4" height="16" rx="1"/><path d="M15 5.4l3.3-.7 2.4 15.4-3.3.7z"/></svg>
        <h1>BookTimer</h1>
    </header>
    <div class="entry-hero">
        <h2>환영합니다! 🎉</h2>
        <p th:text="${needsLoginId} ? '아이디와 시작 설정만 정하면 바로 시작이에요.' : '시작 설정만 정하면 바로 시작이에요.'">시작 설정만 정하면 바로 시작이에요.</p>
    </div>

    <section class="card">
        <p class="entry-note">
            매일 <strong>하루 목표</strong>만큼 읽는 게 목표예요. 못 채운 날은 <strong>최근 7일까지</strong> 빠뜨린 기록으로
            채울 수 있고, 그보다 오래된 날은 부담 없이 자동으로 넘어가요. 목표는 나중에 설정에서 바꿀 수 있어요.
        </p>
        <form th:action="@{/onboarding}" th:object="${onboardingForm}" method="post">
            <!-- login_id는 소셜 로그인 사용자만 여기서 정한다(로컬은 가입에서 받았다 — 불변). -->
            <div class="field" th:if="${needsLoginId}">
                <label for="loginId">아이디 — 로그인·검색에 쓰이는 고유 아이디</label>
                <input type="text" id="loginId" maxlength="20" th:field="*{loginId}"
                       autocapitalize="none" autocomplete="username" placeholder="영문/숫자/_ 3~20자">
                <span class="field-hint muted">⚠️ 한번 정하면 바꿀 수 없어요. 영소문자·숫자·언더스코어(_)만, 3~20자.</span>
                <span class="field-error" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}">아이디 오류</span>
            </div>
            <div class="field">
                <label for="nickname">닉네임 — 다른 사용자에게 보이는 표시 이름 (언제든 변경 가능)</label>
                <input type="text" id="nickname" maxlength="50" th:field="*{nickname}">
                <span class="field-error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}">닉네임 오류</span>
            </div>
            <div class="field">
                <label for="incrementMinutes">하루 목표 (분) — 매일 읽고 싶은 시간</label>
                <input type="number" id="incrementMinutes" min="0" th:field="*{incrementMinutes}">
                <span class="field-hint muted">작게 시작하는 걸 추천해요(예: 20~30분). 나중에 바꿀 수 있어요.</span>
                <span class="field-error" th:if="${#fields.hasErrors('incrementMinutes')}" th:errors="*{incrementMinutes}">목표 오류</span>
            </div>
            <button type="submit" class="btn-primary">시작하기</button>
        </form>
    </section>
</div>
</body>
</html>
