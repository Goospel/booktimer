<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 방문 통계(GA4, 측정 ID 설정 시에만) -->
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <title>프로필 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!-- 광고 로더(게시자 ID 설정 시에만) -->
    <th:block th:replace="~{ads :: loader}"></th:block>
</head>
<body>
<div class="container">
    <header class="brand">
        <a class="brand-home" th:href="@{/}" title="메인 대시보드로">
            <span class="emoji">📚</span>
            <h1>BookTimer</h1>
        </a>
    </header>

    <!-- Vue 섬 마운트 포인트 (선별 SPA 단계 2d).
         data-login-id: 이 프로필의 주인 loginId.
         data-my-login-id: 현재 로그인 사용자 loginId (Vue 섬이 self 판정에 사용). -->
    <div id="profile-app"
         th:attr="data-login-id=${loginId},data-my-login-id=${myLoginId}">불러오는 중…</div>
    <noscript><p class="status-line">JavaScript가 필요합니다.</p></noscript>

    <!-- 광고 (하단, 게시자 ID 설정 시에만) -->
    <div th:replace="~{ads :: unit}"></div>
</div>
<script type="module" th:src="@{/profile/profile.js}"></script>
</body>
</html>
