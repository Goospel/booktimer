<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${nickname} + '님의 책방 — BookTimer'">책방 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <header class="brand">
        <span class="emoji">📚</span>
        <h1>BookTimer</h1>
    </header>
    <p class="greeting"><span th:text="${nickname}">닉네임</span>님의 책방</p>
    <p class="muted" th:text="'@' + ${loginId}">@아이디</p>

    <!-- 팔로우 카운트 + 버튼. 본인 프로필에서만 카운트가 목록(/me/**)으로 링크 — 남의 목록은 비노출(privacy). -->
    <div class="profile-follow">
        <a th:if="${self}" class="follow-count" th:href="@{/me/followers}">팔로워 <strong th:text="${followerCount}">0</strong></a>
        <span th:unless="${self}" class="follow-count">팔로워 <strong th:text="${followerCount}">0</strong></span>
        <a th:if="${self}" class="follow-count" th:href="@{/me/following}">팔로잉 <strong th:text="${followingCount}">0</strong></a>
        <span th:unless="${self}" class="follow-count">팔로잉 <strong th:text="${followingCount}">0</strong></span>
        <span th:unless="${self}" class="follow-action profile-actions">
            <form method="post" th:action="@{${following} ? '/unfollow' : '/follow'}">
                <input type="hidden" name="loginId" th:value="${loginId}">
                <input type="hidden" name="redirect" th:value="@{/u/{n}(n=${loginId})}">
                <button type="submit"
                        th:classappend="${following} ? 'btn-ghost' : 'btn-primary'"
                        th:text="${following} ? '언팔로우' : '팔로우'">팔로우</button>
            </form>
            <!-- 차단: 누르면 상대 프로필이 대칭으로 안 보이게 됨 → 차단 목록으로 이동. 해제도 거기서. -->
            <form method="post" th:action="@{/block}"
                  onsubmit="return confirm('이 사용자를 차단할까요? 서로 팔로우·프로필 열람이 막힙니다.');">
                <input type="hidden" name="loginId" th:value="${loginId}">
                <button type="submit" class="btn-ghost btn-block">차단</button>
            </form>
        </span>
    </div>

    <!-- 신고: 사유를 골라 신고를 접수한다(저장만, 관리자 검토는 추후). 신고 후 이 프로필로 복귀. -->
    <details th:unless="${self}" class="report-box">
        <summary>🚩 이 사용자 신고</summary>
        <form method="post" th:action="@{/report}" class="report-form"
              onsubmit="return confirm('이 사용자를 신고할까요?');">
            <input type="hidden" name="loginId" th:value="${loginId}">
            <input type="hidden" name="redirect" th:value="@{/u/{n}(n=${loginId})}">
            <label>사유
                <select name="reason">
                    <option th:each="r : ${reportReasons}" th:value="${r}" th:text="${r.label}">사유</option>
                </select>
            </label>
            <textarea name="detail" rows="2" maxlength="500" placeholder="상세 내용 (선택)"></textarea>
            <button type="submit" class="btn-ghost btn-block">신고하기</button>
        </form>
    </details>

    <!-- 공개 독서 잔디 (지난 1년, PUBLIC 책 세션만) -->
    <section class="card">
        <h2>독서 잔디</h2>
        <p class="grass-summary">
            지난 1년 동안 <strong th:text="${graph.activeDays()}">0</strong>일 독서 ·
            총 <strong th:text="${graph.totalSeconds() / 3600 + '시간 ' + (graph.totalSeconds() % 3600) / 60 + '분'}">0시간 0분</strong>
        </p>
        <div class="grass">
            <div class="grass-weekdays" aria-hidden="true">
                <span></span><span>월</span><span></span><span>수</span><span></span><span>금</span><span></span>
            </div>
            <div class="grass-main">
                <div class="grass-months" aria-hidden="true">
                    <span th:each="m : ${graph.monthLabels()}"
                          th:text="${m.label()}"
                          th:style="'grid-column-start:' + (${m.weekIndex()} + 1)">1월</span>
                </div>
                <div class="grass-grid">
                    <th:block th:each="week : ${graph.weeks()}">
                        <div class="grass-cell"
                             th:each="day : ${week}"
                             th:classappend="${day.isPlaceholder() ? 'empty' : 'level-' + day.level()}"
                             th:attr="title=${day.isPlaceholder() ? null
                                 : #temporals.format(day.date(), 'yyyy-MM-dd') + ' · ' + (day.totalSeconds() / 60) + '분'}"></div>
                    </th:block>
                </div>
                <div class="grass-legend" aria-hidden="true">
                    <span>목표 미달</span>
                    <i class="grass-cell level-0"></i>
                    <i class="grass-cell level-1"></i>
                    <i class="grass-cell level-2"></i>
                    <i class="grass-cell level-3"></i>
                    <i class="grass-cell level-4"></i>
                    <span>목표 달성</span>
                </div>
            </div>
        </div>
    </section>

    <!-- 공개 책장 (PUBLIC 책만) -->
    <section class="card">
        <h2>공개 책장</h2>

        <!-- 상태 필터 칩 — 부합하는 공개 책만 표시(서버사이드 ?status=). 내 책장(/books)과 동일 패턴. -->
        <nav class="shelf-filter">
            <a th:href="@{/u/{n}(n=${loginId})}" th:classappend="${shelfFilter == null} ? 'active'">전체</a>
            <a th:each="s : ${statuses}"
               th:href="@{/u/{n}(n=${loginId}, status=${s})}"
               th:classappend="${s == shelfFilter} ? 'active'"
               th:text="${s.label}">상태</a>
        </nav>

        <p th:if="${books.isEmpty() and shelfFilter == null}" class="status-line">아직 공개한 책이 없습니다.</p>
        <p th:if="${books.isEmpty() and shelfFilter != null}" class="status-line">이 상태의 공개 책이 없습니다.</p>
        <ul class="book-list" th:unless="${books.isEmpty()}">
            <li class="book-row" th:each="b : ${books}">
                <img class="book-cover" th:if="${b.coverUrl}" th:src="${b.coverUrl}" alt="" referrerpolicy="no-referrer">
                <div class="book-meta">
                    <span class="book-title" th:text="${b.title}">제목</span>
                    <span class="book-author" th:if="${b.author}" th:text="${b.author}">저자</span>
                    <span class="book-status-badge" th:text="${b.status.label}">상태</span>
                    <span class="book-time mono" th:with="secs=${bookTimes.get(b.id)}"
                          th:if="${secs != null and secs > 0}"
                          th:text="'⏱ ' + ${secs / 3600 + '시간 ' + (secs % 3600) / 60 + '분'}">⏱ 0시간 0분</span>
                </div>
            </li>
        </ul>
    </section>

    <p class="link-row">
        <a th:href="@{/}">← 대시보드</a>
        <a th:href="@{/books}">📚 내 책장</a>
        <a th:if="${self}" th:href="@{/me/blocks}">🚫 차단 목록</a>
    </p>
</div>
</body>
</html>
