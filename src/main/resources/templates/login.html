<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 방문 통계(GA4, 측정 ID 설정 시에만) -->
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <th:block th:replace="~{fragments/pwa-head :: meta}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page">
<div class="auth-shell">
    <header class="auth-brand">
        <svg class="auth-brand-ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="3.4" height="16" rx="1"/><rect x="9.3" y="4" width="3.4" height="16" rx="1"/><path d="M15 5.4l3.3-.7 2.4 15.4-3.3.7z"/></svg>
        <span class="auth-brand-name">BookTimer</span>
    </header>
    <p class="auth-greeting">로그인</p>

    <!-- 플래시 안내 — 가입완료/계정삭제는 성공, 로그아웃은 중립, 인증실패는 에러 배너 -->
    <div th:if="${param.registered}" class="auth-alert auth-alert-ok">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.2l2.4 2.4 4.6-4.8"/></svg>
        <span>회원가입이 완료됐어요. 로그인해 주세요.</span>
    </div>
    <div th:if="${param.logout}" class="auth-alert auth-alert-logout">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-3"/><path d="M10 16l-4-4 4-4"/><path d="M6 12h9"/></svg>
        <span>로그아웃되었습니다.</span>
    </div>
    <div th:if="${param.deleted}" class="auth-alert auth-alert-ok">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.2l2.4 2.4 4.6-4.8"/></svg>
        <span>계정이 삭제되었습니다. 그동안 이용해 주셔서 감사합니다.</span>
    </div>
    <div th:if="${param.error}" class="auth-alert auth-alert-error">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5"/><path d="M12 16.2v.01"/></svg>
        <span>아이디 또는 비밀번호가 올바르지 않습니다.</span>
    </div>
    <!-- 코드 로그인 실패는 ?error와 분리한다 — 코드 실패에 "아이디 또는 비밀번호" 안내가 뜨면 오안내다. -->
    <div th:if="${param.codeError}" class="auth-alert auth-alert-error">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5"/><path d="M12 16.2v.01"/></svg>
        <span>코드가 올바르지 않거나 만료됐어요. 토스 앱에서 새 코드를 받아 주세요.</span>
    </div>
    <div th:if="${param.codeLimited}" class="auth-alert auth-alert-error">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5"/><path d="M12 16.2v.01"/></svg>
        <span>시도가 너무 많아요. 잠시 후 다시 해 주세요.</span>
    </div>

    <section class="auth-card">
        <!-- th:action 유지 = Spring Security CSRF 토큰 자동 주입. name=username/password 변경 금지. -->
        <form th:action="@{/login}" method="post">
            <div class="auth-field">
                <label class="auth-label" for="username">아이디</label>
                <input class="auth-input" type="text" id="username" name="username" autocomplete="username" autofocus>
            </div>
            <div class="auth-field">
                <label class="auth-label" for="password">비밀번호</label>
                <input class="auth-input" type="password" id="password" name="password" autocomplete="current-password">
            </div>
            <button type="submit" class="auth-btn-primary">로그인</button>
        </form>

        <div class="auth-divider"><span>또는</span></div>

        <!-- 소셜 로그인: GET /oauth2/authorization/google → 구글 인가 화면으로 리다이렉트 -->
        <a class="auth-btn-google" th:href="@{/oauth2/authorization/google}">
            <svg width="17" height="17" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.71-1.57 2.68-3.89 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.34A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.97 10.72a5.4 5.4 0 0 1 0-3.44V4.94H.96a9 9 0 0 0 0 8.12l3.01-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.47.9 11.43 0 9 0A9 9 0 0 0 .96 4.94l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
            Google로 계속하기
        </a>

        <!-- 세 번째 선택지: 토스 미니앱에서 시작한 계정(비밀번호 없음)의 유일한 웹 진입로.
             기본 동선(아이디·구글)을 밀어내지 않게 네이티브 <details>로 접어 둔다 — JS 없이 동작한다.
             실패 후에는 th:open으로 펼쳐 방금 틀린 입력칸을 바로 보여 준다(Thymeleaf 고정값 불리언
             속성 프로세서라 false면 open 속성을 아예 안 찍는다). -->
        <details class="auth-details" th:open="${param.codeError != null or param.codeLimited != null}">
            <summary>토스 앱에서 시작했다면 — 코드로 로그인</summary>
            <!-- th:action 유지 = CSRF 토큰 자동 주입. 이 폼을 CSRF 예외로 두면 다른 사이트가 사용자의
                 브라우저로 코드를 대신 제출할 수 있다. -->
            <form th:action="@{/login/toss-code}" method="post">
                <div class="auth-field">
                    <label class="auth-label" for="code">토스 앱 설정에서 받은 로그인 코드</label>
                    <input class="auth-input" type="text" id="code" name="code" maxlength="12"
                           autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
                </div>
                <button type="submit" class="auth-btn-primary">코드로 로그인</button>
            </form>
        </details>
    </section>

    <nav class="auth-links">
        <a th:href="@{/password/forgot}">비밀번호를 잊으셨나요?</a>
        <a class="auth-link-muted" th:href="@{/signup}">계정이 없나요? <span class="auth-link-accent">회원가입</span></a>
        <a th:href="@{/privacy}">개인정보처리방침</a>
    </nav>
</div>
</body>
</html>
