<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 방문 통계(GA4, 측정 ID 설정 시에만) -->
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>로그인 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <header class="brand">
        <span class="emoji">📚</span>
        <h1>BookTimer</h1>
    </header>
    <p class="greeting">로그인</p>

    <div th:if="${param.registered}" class="alert alert-ok">회원가입이 완료됐어요. 로그인해 주세요.</div>
    <div th:if="${param.logout}" class="alert alert-ok">로그아웃되었습니다.</div>
    <div th:if="${param.deleted}" class="alert alert-ok">계정이 삭제되었습니다. 그동안 이용해 주셔서 감사합니다.</div>
    <div th:if="${param.error}" class="alert alert-error">아이디 또는 비밀번호가 올바르지 않습니다.</div>

    <section class="card">
        <form th:action="@{/login}" method="post">
            <div class="field">
                <label for="username">아이디</label>
                <input type="text" id="username" name="username" autocomplete="username" autofocus>
            </div>
            <div class="field">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password">
            </div>
            <button type="submit" class="btn-primary">로그인</button>
        </form>

        <div class="oauth-divider"><span>또는</span></div>

        <!-- 소셜 로그인: GET /oauth2/authorization/google → 구글 인가 화면으로 리다이렉트 -->
        <a class="btn-oauth btn-oauth-google" th:href="@{/oauth2/authorization/google}">
            <span class="oauth-icon">G</span> Google로 계속하기
        </a>
    </section>

    <p class="link-row"><a th:href="@{/password/forgot}">비밀번호를 잊으셨나요?</a></p>
    <p class="link-row"><a th:href="@{/signup}">계정이 없나요? 회원가입</a></p>
    <p class="link-row"><a th:href="@{/privacy}">개인정보처리방침</a></p>
</div>
</body>
</html>
