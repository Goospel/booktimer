<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <title>책BTI — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <header class="brand">
        <a class="brand-home" th:href="@{/}" title="메인 대시보드로">
            <span class="emoji">📚</span>
            <h1>BookTimer</h1>
        </a>
    </header>

    <div id="personality-app"
         th:attr="data-nickname=${nickname}, data-login-id=${loginId}">불러오는 중…</div>

    <noscript>
        <p class="status-line">JavaScript가 비활성화되어 있습니다. 책BTI를 보려면 JavaScript를 활성화해 주세요.</p>
    </noscript>
</div>
<script type="module" th:src="@{/personality/personality.js}"></script>
</body>
</html>
