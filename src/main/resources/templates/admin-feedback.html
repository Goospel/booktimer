<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 방문 통계(GA4, 측정 ID 설정 시에만) -->
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>문의함 — BookTimer 관리자</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <header class="brand">
        <h1>문의함</h1>
    </header>
    <p class="status-line muted">사용자 문의를 읽고 읽음/처리완료를 표시하거나 답장합니다. 상태·답장은 작성자 본인 화면에만 보입니다.</p>

    <p class="alert alert-error" th:if="${error}" th:text="${error}">에러</p>

    <!-- 유형 필터 — ?type= 쿼리 + 탭. activeType이 null이면 '전체'. -->
    <nav class="fb-filter" aria-label="유형 필터">
        <a th:href="@{/admin/feedback}" th:classappend="${activeType == null} ? ' active'">전체</a>
        <a th:each="t : ${types}" th:href="@{/admin/feedback(type=${t.name()})}"
           th:text="${t.label}" th:classappend="${activeType == t} ? ' active'">유형</a>
    </nav>

    <p class="status-line muted" th:if="${feedbackList.isEmpty()}">해당하는 문의가 없습니다.</p>

    <section class="card fb-admin-item" th:each="row : ${feedbackList}">
        <div class="fb-head">
            <span class="fb-type" th:text="${row.type.label}">유형</span>
            <span th:class="'fb-badge fb-' + ${row.status.name().toLowerCase()}"
                  th:text="${row.status.label}">상태</span>
            <span class="fb-author"
                  th:text="${row.authorLoginId != null ? '@' + row.authorLoginId : row.authorNickname}">작성자</span>
        </div>
        <p class="fb-title" th:text="${row.title}">제목</p>
        <p class="fb-content" th:text="${row.content}">내용</p>
        <div class="fb-actions">
            <form th:action="@{/admin/feedback/{id}/read(id=${row.id})}" method="post">
                <button type="submit" class="btn-ghost btn-small">읽음</button>
            </form>
            <form th:action="@{/admin/feedback/{id}/resolve(id=${row.id})}" method="post">
                <button type="submit" class="btn-primary btn-small">처리완료</button>
            </form>
            <form th:action="@{/admin/feedback/{id}/delete(id=${row.id})}" method="post"
                  data-confirm="이 문의를 삭제할까요?">
                <button type="submit" class="btn-danger btn-small">삭제</button>
            </form>
        </div>
        <!-- 단일 답장(덮어쓰기). 저장하면 자동 '읽음'(처리완료는 별도 버튼). 작성자 본인만 봄. -->
        <form class="fb-reply-form" th:action="@{/admin/feedback/{id}/reply(id=${row.id})}" method="post">
            <label class="fb-reply-label">개발자 답장<span class="muted" th:if="${row.reply != null}"> · 작성자에게 노출 중</span></label>
            <textarea name="reply" rows="2" maxlength="1000"
                      placeholder="작성자에게 보낼 답장 — 저장하면 자동으로 '읽음' 처리됩니다" th:text="${row.reply}"></textarea>
            <button type="submit" class="btn-ghost btn-small">답장 저장</button>
        </form>
    </section>

    <nav class="link-row" aria-label="페이지 이동">
        <th:block th:replace="~{fragments/nav-links :: navLink(@{/admin}, 'back', '관리자 홈')}"></th:block>
    </nav>
</div>
<!-- data-confirm 위임 리스너 — 인라인 onsubmit은 CSP에서 실행되지 않는다 -->
<script th:attr="nonce=${cspNonce}" th:src="@{/js/confirm-submit.js}"></script>
</body>
</html>
