<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>새 비밀번호 설정 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <header class="brand">
        <span class="emoji">📚</span>
        <h1>BookTimer</h1>
    </header>
    <p class="greeting">새 비밀번호 설정</p>

    <div th:if="${error}" class="alert alert-error" th:text="${error}">오류</div>

    <section class="card">
        <!-- 토큰 소비는 이 POST에서만 일어난다(메일 링크 프리페치가 토큰을 소진하지 못하게 GET과 분리). -->
        <form th:action="@{/password/reset}" method="post">
            <input type="hidden" name="token" th:value="${token}">
            <div class="field">
                <label for="password">새 비밀번호</label>
                <input type="password" id="password" name="password" autocomplete="new-password"
                       minlength="8" maxlength="72" required autofocus>
            </div>
            <div class="field">
                <label for="passwordConfirm">새 비밀번호 확인</label>
                <input type="password" id="passwordConfirm" name="passwordConfirm" autocomplete="new-password"
                       minlength="8" maxlength="72" required>
            </div>
            <button type="submit" class="btn-primary">비밀번호 변경</button>
        </form>
    </section>
</div>
</body>
</html>
