<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${book.title} + ' — BookTimer'">책 상세 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!-- 광고 로더(게시자 ID 설정 시에만) -->
    <th:block th:replace="~{ads :: loader}"></th:block>
</head>
<body>
<div class="container">
    <header class="brand">
        <a class="brand-home" th:href="@{/}" title="메인 대시보드로">
            <span class="emoji">📚</span>
            <h1>BookTimer</h1>
        </a>
    </header>

    <!-- 책 헤더 (표지 + 메타) -->
    <section class="card book-detail-head">
        <img th:if="${book.coverUrl}" th:src="${book.coverUrl}" alt="표지" class="book-cover">
        <div class="book-meta">
            <h2 th:text="${book.title}">책 제목</h2>
            <p class="book-sub">
                <span th:if="${book.author}" th:text="${book.author}">저자</span>
                <span th:if="${book.publisher}" th:text="' · ' + ${book.publisher}">출판사</span>
            </p>
            <p>
                <span class="book-status-badge" th:text="${book.status.label}">상태</span>
                <span class="record-time mono"
                      th:text="'· 누적 ' + (${totalSeconds} / 3600) + '시간 ' + ((${totalSeconds} % 3600) / 60) + '분'">· 누적 0시간 0분</span>
            </p>
            <p>
                <!-- 구매처 2개면 '구매' 토글로 묶고 1개뿐이면 단일 버튼 — 조건은 데이터로 동적 분기. -->
                <details th:if="${!#strings.isEmpty(book.purchaseLink) and coupangEnabled}" class="buy-menu">
                    <summary class="btn-ghost">구매</summary>
                    <div class="buy-menu-items">
                        <a th:href="@{/books/{id}/buy(id=${book.id})}" target="_blank" rel="noopener nofollow">알라딘</a>
                        <a th:href="@{/books/{id}/buy/coupang(id=${book.id})}" target="_blank" rel="noopener nofollow">쿠팡</a>
                    </div>
                </details>
                <a th:if="${!#strings.isEmpty(book.purchaseLink) and !coupangEnabled}" th:href="@{/books/{id}/buy(id=${book.id})}" target="_blank"
                   rel="noopener nofollow" class="btn-ghost">구매</a>
                <a th:if="${#strings.isEmpty(book.purchaseLink) and coupangEnabled}" th:href="@{/books/{id}/buy/coupang(id=${book.id})}" target="_blank"
                   rel="noopener nofollow" class="btn-ghost">쿠팡</a>
            </p>
            <p class="affiliate-note" th:if="${coupangEnabled}">
                이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.
            </p>
        </div>
    </section>

    <!-- 이 책 독서 잔디 (지난 1년) — GitHub 컨트리뷰션 그래프 스타일 -->
    <section class="card">
        <h2>이 책 독서 잔디</h2>
        <p class="grass-summary">
            지난 1년 동안 <strong th:text="${graph.activeDays()}">0</strong>일 ·
            총 <strong th:text="${graph.totalSeconds() / 3600 + '시간 ' + (graph.totalSeconds() % 3600) / 60 + '분'}">0시간 0분</strong>
        </p>
        <div class="grass">
            <div class="grass-weekdays" aria-hidden="true">
                <span></span><span>월</span><span></span><span>수</span><span></span><span>금</span><span></span>
            </div>
            <div class="grass-main">
                <div class="grass-months" aria-hidden="true">
                    <span th:each="m : ${graph.monthLabels()}"
                          th:text="${m.label()}"
                          th:style="'grid-column-start:' + (${m.weekIndex()} + 1)">1월</span>
                </div>
                <div class="grass-grid">
                    <th:block th:each="week : ${graph.weeks()}">
                        <div class="grass-cell"
                             th:each="day : ${week}"
                             th:classappend="${day.isPlaceholder() ? 'empty' : 'level-' + day.level() + (day.manual() ? ' manual' : '')}"
                             th:attr="title=${day.isPlaceholder() ? null
                                 : #temporals.format(day.date(), 'yyyy-MM-dd') + ' · ' + (day.totalSeconds() / 60) + '분' + (day.manual() ? ' · 직접 채움' : '')}"></div>
                    </th:block>
                </div>
                <!-- 색 농도 = 그날 독서 시간 ÷ 하루 목표 달성 비율 -->
                <div class="grass-legend" aria-hidden="true">
                    <span>목표 미달</span>
                    <i class="grass-cell level-0"></i>
                    <i class="grass-cell level-1"></i>
                    <i class="grass-cell level-2"></i>
                    <i class="grass-cell level-3"></i>
                    <i class="grass-cell level-4"></i>
                    <span>목표 달성</span>
                    <i class="grass-cell level-2 manual legend-gap"></i>
                    <span>직접 채움</span>
                </div>
            </div>
        </div>
    </section>

    <!-- 기록 없음 -->
    <section class="card" th:if="${history.isEmpty()}">
        <p class="status-line">아직 이 책으로 측정한 기록이 없습니다. 타이머 시작 시 이 책을 선택해 보세요.</p>
    </section>

    <!-- 일자별 기록 (최신순) -->
    <section class="card" th:unless="${history.isEmpty()}">
        <h2>일자별 독서 시간</h2>
        <ul class="record-list">
            <li class="record-row" th:each="r : ${history}">
                <span class="record-date" th:text="${#temporals.format(r.date(), 'yyyy-MM-dd (E)')}">2026-06-01</span>
                <span class="record-time mono"
                      th:text="${(r.totalSeconds() / 3600) + '시간 ' + ((r.totalSeconds() % 3600) / 60) + '분'}">0시간 0분</span>
            </li>
        </ul>
    </section>

    <!-- 광고 (하단, 게시자 ID 설정 시에만) -->
    <div th:replace="~{ads :: unit}"></div>

    <p class="link-row">
        <a th:href="@{/books}">← 내 책장</a>
        <a th:href="@{/}">대시보드</a>
    </p>
</div>
</body>
</html>
