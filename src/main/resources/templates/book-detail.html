<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 방문 통계(GA4, 측정 ID 설정 시에만) -->
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${book.title} + ' — BookTimer'">책 상세 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!-- 광고 로더(게시자 ID 설정 시에만) -->
    <th:block th:replace="~{ads :: loader}"></th:block>
</head>
<body>
<div class="container">
    <header class="brand">
        <a class="brand-home" th:href="@{/}" title="메인 대시보드로">
            <span class="emoji">📚</span>
            <h1>BookTimer</h1>
        </a>
    </header>

    <!-- 책 헤더 (표지 + 메타) -->
    <section class="card book-detail-head">
        <img th:if="${book.coverUrl}" th:src="${book.coverUrl}" alt="표지" class="book-cover">
        <div class="book-meta">
            <h2 th:text="${book.title}">책 제목</h2>
            <p class="book-sub">
                <span th:if="${book.author}" th:text="${book.author}">저자</span>
                <span th:if="${book.publisher}" th:text="' · ' + ${book.publisher}">출판사</span>
            </p>
            <p>
                <span class="book-status-badge" th:text="${book.status.label}">상태</span>
                <!-- 정수 나눗셈을 쓰려면 산술 전체가 한 ${...}(SpEL) 안에 있어야 한다. `${x} / 3600`처럼 ${} 밖에서
                     나누면 Thymeleaf 산술이 소수로 평가해 "1.5시간"이 샌다(일자별 행·history 화면과 동일 패턴으로 통일). -->
                <span class="record-time mono"
                      th:text="${'· 누적 ' + (totalSeconds / 3600) + '시간 ' + ((totalSeconds % 3600) / 60) + '분'}">· 누적 0시간 0분</span>
            </p>
            <p>
                <!-- 구매처 2개면 '구매' 토글로 묶고 1개뿐이면 단일 버튼 — 조건은 데이터로 동적 분기. -->
                <details th:if="${!#strings.isEmpty(book.purchaseLink) and coupangEnabled}" class="buy-menu">
                    <summary class="btn-ghost">구매</summary>
                    <div class="buy-menu-items">
                        <a th:href="@{/books/{id}/buy(id=${book.id})}" target="_blank" rel="noopener nofollow">알라딘</a>
                        <a th:href="@{/books/{id}/buy/coupang(id=${book.id})}" target="_blank" rel="noopener nofollow">쿠팡</a>
                    </div>
                </details>
                <a th:if="${!#strings.isEmpty(book.purchaseLink) and !coupangEnabled}" th:href="@{/books/{id}/buy(id=${book.id})}" target="_blank"
                   rel="noopener nofollow" class="btn-ghost">구매</a>
                <a th:if="${#strings.isEmpty(book.purchaseLink) and coupangEnabled}" th:href="@{/books/{id}/buy/coupang(id=${book.id})}" target="_blank"
                   rel="noopener nofollow" class="btn-ghost">쿠팡</a>
            </p>
            <p class="affiliate-note" th:if="${coupangEnabled}">
                이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.
            </p>
        </div>
    </section>

    <!-- 일자별 독서 시간 — 한 번에 한 달, ◀▶로 이동, 그 달 안에서만 스크롤(독서 기록 화면과 동일 패턴).
         월별 묶음(months, 최신 월 먼저)을 모두 렌더하되 최신 달만 보이고(th:hidden) JS가 ◀▶로 hidden을 토글한다.
         JS가 꺼져도 최신 달은 보인다(폴백). 월 합계는 네비 라벨에 함께 띄운다. 책 상세라 행에 책 제목은 안 보인다. -->
    <section class="card">
        <h2>일자별 독서 시간</h2>
        <p class="status-line" th:if="${months.isEmpty()}">아직 이 책으로 측정한 기록이 없습니다. 타이머 시작 시 이 책을 선택해 보세요.</p>
        <div th:unless="${months.isEmpty()}" class="month-browser">
            <div class="month-nav">
                <button type="button" class="month-nav-btn month-nav-prev" aria-label="이전 달">◀</button>
                <span class="month-nav-label"
                      th:text="${months[0].month().getYear() + '년 ' + months[0].month().getMonthValue() + '월 · ' + (months[0].totalSeconds() / 3600) + '시간 ' + ((months[0].totalSeconds() % 3600) / 60) + '분'}">2026년 6월 · 0시간 0분</span>
                <button type="button" class="month-nav-btn month-nav-next" aria-label="다음 달">▶</button>
            </div>
            <div class="month-section" th:each="s, it : ${months}" th:hidden="${!it.first}"
                 th:attr="data-label=${s.month().getYear() + '년 ' + s.month().getMonthValue() + '월 · ' + (s.totalSeconds() / 3600) + '시간 ' + ((s.totalSeconds() % 3600) / 60) + '분'}">
                <ul class="record-list record-scroll">
                    <li class="record-row" th:each="r : ${s.days()}">
                        <span class="record-date" th:text="${#temporals.format(r.date(), 'yyyy-MM-dd (E)')}">2026-06-01</span>
                        <span class="record-time mono"
                              th:text="${(r.totalSeconds() / 3600) + '시간 ' + ((r.totalSeconds() % 3600) / 60) + '분'}">0시간 0분</span>
                    </li>
                </ul>
            </div>
        </div>
    </section>

    <!-- 광고 (하단, 게시자 ID 설정 시에만) -->
    <div th:replace="~{ads :: unit}"></div>

    <p class="link-row">
        <a th:href="@{/books}">← 내 책장</a>
        <a th:href="@{/}">대시보드</a>
    </p>
</div>

<!-- 일자별 독서 기록: 한 번에 한 달만 보이고 ◀(과거)/▶(최신)로 이동. 월 섹션은 최신이 인덱스 0(서버가 최신만 렌더).
     JS가 없어도 최신 달은 보이는 폴백. 외부 의존(Alpine/htmx) 없이 바닐라로 hidden만 토글한다(history 화면과 동일). -->
<script>
  (function () {
    var sections = Array.prototype.slice.call(document.querySelectorAll('.month-section'));
    if (sections.length < 1) return;
    var prev = document.querySelector('.month-nav-prev');
    var next = document.querySelector('.month-nav-next');
    var label = document.querySelector('.month-nav-label');
    var idx = 0; // 0 = 최신 달
    function render() {
      for (var i = 0; i < sections.length; i++) sections[i].hidden = (i !== idx);
      if (label) label.textContent = sections[idx].getAttribute('data-label');
      if (next) next.disabled = (idx === 0);                   // 더 최신 없음
      if (prev) prev.disabled = (idx === sections.length - 1); // 더 과거 없음
    }
    if (prev) prev.addEventListener('click', function () { if (idx < sections.length - 1) { idx++; render(); } });
    if (next) next.addEventListener('click', function () { if (idx > 0) { idx--; render(); } });
    render();
  })();
</script>
</body>
</html>
