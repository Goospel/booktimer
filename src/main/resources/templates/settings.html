<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>설정 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <header class="brand">
        <span class="emoji">📚</span>
        <h1>BookTimer</h1>
    </header>
    <p class="greeting">설정</p>

    <div th:if="${message}" class="alert alert-ok" th:text="${message}">저장됨</div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}">오류</div>

    <section class="card">
        <form th:action="@{/settings}" th:object="${settingsForm}" method="post">
            <div class="field">
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" th:field="*{nickname}">
                <span class="field-error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}">닉네임 오류</span>
            </div>
            <div class="field">
                <label for="timezone">타임존</label>
                <select id="timezone" th:field="*{timezone}">
                    <option th:each="tz : ${timezones}" th:value="${tz}" th:text="${tz}">Asia/Seoul</option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('timezone')}" th:errors="*{timezone}">타임존 오류</span>
            </div>
            <div class="field">
                <label for="incrementMinutes">하루 증가값 (분)</label>
                <input type="number" id="incrementMinutes" min="0" th:field="*{incrementMinutes}">
                <span class="field-error" th:if="${#fields.hasErrors('incrementMinutes')}" th:errors="*{incrementMinutes}">증가값 오류</span>
            </div>
            <div class="field">
                <label for="capMinutes">누적 상한 cap (분)</label>
                <input type="number" id="capMinutes" min="0" th:field="*{capMinutes}">
                <span class="field-error" th:if="${#fields.hasErrors('capMinutes')}" th:errors="*{capMinutes}">cap 오류</span>
            </div>
            <button type="submit" class="btn-primary">저장</button>
        </form>
    </section>

    <!-- 비밀번호 변경 -->
    <section class="card">
        <h2>비밀번호 변경</h2>
        <form th:action="@{/settings/password}" method="post">
            <div class="field">
                <label for="currentPassword">현재 비밀번호</label>
                <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password">
            </div>
            <div class="field">
                <label for="newPassword">새 비밀번호 (8자 이상)</label>
                <input type="password" id="newPassword" name="newPassword" autocomplete="new-password">
            </div>
            <div class="field">
                <label for="confirmPassword">새 비밀번호 확인</label>
                <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password">
            </div>
            <button type="submit" class="btn-primary">비밀번호 변경</button>
        </form>
    </section>

    <!-- 회원 탈퇴 (위험 구역) -->
    <section class="card danger-zone">
        <h2>회원 탈퇴</h2>
        <p class="status-line">계정과 모든 독서 기록이 영구 삭제됩니다. 되돌릴 수 없습니다.</p>
        <form th:action="@{/settings/delete}" method="post"
              onsubmit="return confirm('정말 탈퇴하시겠어요? 모든 기록이 삭제되며 되돌릴 수 없습니다.');">
            <div class="field">
                <label for="password">확인을 위해 비밀번호를 입력하세요</label>
                <input type="password" id="password" name="password" autocomplete="current-password">
            </div>
            <button type="submit" class="btn-danger">계정 영구 삭제</button>
        </form>
    </section>

    <p class="link-row"><a th:href="@{/}">← 대시보드로</a></p>
</div>
</body>
</html>
