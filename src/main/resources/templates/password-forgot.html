<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 재설정 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <header class="brand">
        <span class="emoji">📚</span>
        <h1>BookTimer</h1>
    </header>
    <p class="greeting">비밀번호 재설정</p>

    <section class="card">
        <div class="entry-hero">
            <p>가입하신 이메일 주소를 입력해 주세요. 재설정 링크를 보내드릴게요.</p>
        </div>
        <form th:action="@{/password/forgot}" method="post">
            <div class="field">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" autocomplete="email" autofocus required>
            </div>
            <button type="submit" class="btn-primary">재설정 링크 받기</button>
        </form>
    </section>

    <p class="link-row"><a th:href="@{/login}">로그인으로 돌아가기</a></p>
</div>
</body>
</html>
