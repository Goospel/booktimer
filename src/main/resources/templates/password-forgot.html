<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!-- 방문 통계(GA4, 측정 ID 설정 시에만) -->
    <th:block th:replace="~{analytics :: gtag}"></th:block>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 재설정 — BookTimer</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="container">
    <header class="brand">
        <svg class="brand-ico" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="3.4" height="16" rx="1"/><rect x="9.3" y="4" width="3.4" height="16" rx="1"/><path d="M15 5.4l3.3-.7 2.4 15.4-3.3.7z"/></svg>
        <h1>BookTimer</h1>
    </header>
    <p class="greeting">비밀번호 재설정</p>

    <section class="card">
        <div class="entry-hero">
            <p>가입하신 이메일 주소를 입력해 주세요. 재설정 링크를 보내드릴게요.</p>
        </div>
        <form th:action="@{/password/forgot}" method="post">
            <div class="field">
                <label for="email">이메일</label>
                <input type="email" id="email" name="email" autocomplete="email" autofocus required>
            </div>
            <button type="submit" class="btn-primary">재설정 링크 받기</button>
        </form>
    </section>

    <p class="link-row"><a th:href="@{/login}">로그인으로 돌아가기</a></p>
</div>
</body>
</html>
