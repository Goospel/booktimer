spring.application.name=booktimer

# --- 세션 수명 ---
# 비활성 타임아웃을 30일로(기본 30분 → 너무 짧음). 독서 타이머는 클라이언트(JS)에서만 1초마다 돌고
# 읽는 동안 서버로 요청을 안 보내므로, 30분 기본값이면 오래 읽다 "측정 종료"를 누를 때 세션이 만료돼
# 로그아웃된다(독서 타이머 앱에 치명적). 세션은 MySQL에 외부화돼 있어(Spring Session JDBC) 길게 잡아도
# 메모리 부담이 없다.
# ⚠️ 이 프로퍼티는 Boot 4 + Spring Session JDBC에서 세션 저장소에 연결되지 않는다(무동작 — cookieSerializer·
# ForwardedHeaderFilter와 같은 "프로퍼티 무동작" 함정). 실제 타임아웃은 WebConfig의 **이중 타임아웃**이 담당한다:
# 저장소 기본값(=익명) 1일 = WebConfig#sessionTimeoutCustomizer, 로그인 성공 시 30일로 연장 =
# security/SessionLifetimeListener (검증: SessionDualTimeoutTest). 쿠키 Max-Age는 WebConfig#cookieSerializer가 30일로 영속화한다.
# 아래 값(30d)은 위 어느 것도 바꾸지 않는다 — 의도 문서화 + 서블릿 컨테이너 기본값용으로만 남겨둔다.
server.servlet.session.timeout=30d

# --- Flyway (스키마 마이그레이션) ---
# 스키마의 단일 소스는 db/migration 의 V__ 마이그레이션이다 (ddl-auto 아님).
# 기존 운영 DB는 ddl-auto=update로 만들어져 flyway_schema_history가 없으므로, 첫 기동 때
# baseline으로 "V1이 이미 적용된 것"으로 표시하고 실행하지 않는다(baseline-version=1).
# 신규 환경(테스트 H2, 새 배포)에선 비어 있으므로 V1부터 실제로 실행된다.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# 프록시(ALB) 뒤에서의 HTTPS 인식(X-Forwarded-*)은 ForwardedHeaderFilter를 명시 빈으로 등록해 처리한다.
# → com.booktimer.config.WebConfig (server.forward-headers-strategy 프로퍼티 대신 명시 등록 — N-021)

# 세션 쿠키(SESSION) 속성(SameSite=Lax/HttpOnly/Secure)은 server.servlet.session.cookie.* 프로퍼티가
# Spring Session 직렬화기에 연결되지 않아 무동작이므로(Boot 4 함정), WebConfig의 명시 CookieSerializer
# 빈으로 설정한다 → com.booktimer.config.WebConfig#cookieSerializer (SessionCookieSameSiteTest로 검증)

# --- OAuth2 소셜 로그인 (Google) ---
# 실제 client-id/secret 은 환경변수(GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET)로 주입한다.
# 커밋에는 절대 실값을 넣지 않는다. 기본값('not-configured')은 자격증명이 없어도 앱이 부팅되게
# 하기 위한 placeholder — 이 상태에서 구글 버튼을 누르면 구글이 invalid_client로 막는다(정상).
# 'google'은 스프링이 아는 표준 provider라 authorization/token/issuer URI가 자동으로 채워진다.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# --- 광고 (Google AdSense) ---
# 게시자 ID(ca-pub-...)가 비어 있으면 광고를 렌더하지 않는다(스캐폴드 상태 — 깨진 빈 광고/정책 위반 방지).
# AdSense 사이트 승인 후 환경변수로 실값을 주입한다 — 커밋에 실값 금지(OAuth 키와 동일 정책).
# 노출 위치: 부가 화면(독서 기록·책 목록·책 상세·프로필·검색) + 대시보드 하단에만 1개씩(타이머 동선 제외).
booktimer.ads.client-id=${ADSENSE_CLIENT_ID:}
booktimer.ads.slot=${ADSENSE_SLOT:}

# --- 방문 통계 (Google Analytics 4) ---
# 측정 ID(G-XXXXXXXXXX)가 비어 있으면 gtag 스크립트를 렌더하지 않는다(AdSense와 동일 config-gate).
# "접근 시작조차 안 하나(유통) vs 들어와 바로 나가나(랜딩)"를 분리 측정하려고 심는다.
# GA4 속성 생성 후 환경변수로 실값 주입 — 커밋에 실값 금지(OAuth·AdSense 키와 동일 정책).
booktimer.analytics.ga-id=${GA_MEASUREMENT_ID:}

# --- 쿠팡 파트너스 (버튼 노출 게이트 — 딥링크 API 키와 별개) ---
# "파트너 가입 여부"(버튼·고지문구 노출)와 "딥링크 API 키 보유 여부"(정식 추적링크 변환 가능 여부)는
# 서로 다른 게이트다 — 파트너 가입은 이미 완료됐지만 딥링크 API 키(추가 승인 게이트, 아래 섹션)는 아직
# 없는 지금, 이 값을 딥링크 키에 묶으면 이미 운영에 떠 있는 버튼이 사라지는 회귀가 된다. 기본값 false
# (미설정 시 안전하게 숨김), 운영은 task-definition.json에서 명시적으로 true로 켠다.
booktimer.coupang.partner-enabled=${BOOKTIMER_COUPANG_PARTNER_ENABLED:false}

# --- 쿠팡 파트너스 딥링크 API (dark-launch) ---
# 딥링크 API 키(access-key/secret-key)는 파트너스 '최종 승인'(누적 판매 15만원 이상) 후에야 발급된다.
# 미설정("not-configured")이면 CoupangDeeplinkClient가 API 호출을 시도하지 않고 raw 검색 URL로
# 즉시 폴백한다(버튼 노출 자체는 위 partner-enabled가 별도로 게이트). 키 확보 후
# 환경변수 주입만으로 점등된다 — 커밋에 실값 금지(OAuth·AdSense 키와 동일 정책). N-146/T-129 참고.
booktimer.coupang.access-key=${BOOKTIMER_COUPANG_ACCESS_KEY:not-configured}
booktimer.coupang.secret-key=${BOOKTIMER_COUPANG_SECRET_KEY:not-configured}
booktimer.coupang.sub-id=${BOOKTIMER_COUPANG_SUB_ID:}
booktimer.coupang.api-base-url=${BOOKTIMER_COUPANG_API_BASE_URL:https://api-gateway.coupang.com}
booktimer.coupang.requested-by=${BOOKTIMER_COUPANG_REQUESTED_BY:booktimer}

# --- 이메일 발송 (transactional) ---
# 가입 이메일 인증·비밀번호 재설정·보안 통지 메일 발송 토글. 기본은 꺼짐(false) — 발송 인프라(SES SMTP·DNS)가
# 준비되기 전엔 LoggingEmailSender가 실발송 없이 로그만 남긴다(메일 0). 도메인 검증·SPF/DKIM/DMARC가 갖춰진 뒤
# 환경변수 BOOKTIMER_EMAIL_ENABLED=true 로 켜면 SmtpEmailSender(JavaMailSender)가 실제 발송한다.
# SMTP 자격증명(spring.mail.*)은 운영에서 환경변수로 주입한다 — 커밋에 실값 금지(OAuth 키와 동일 정책).
booktimer.email.enabled=${BOOKTIMER_EMAIL_ENABLED:false}
booktimer.email.from=${BOOKTIMER_EMAIL_FROM:noreply@booktimer.app}
# SES 반송·불만 SNS 웹훅(/internal/ses/notifications)이 신뢰할 TopicArn. 설정되면 그 토픽 메시지만 처리하고
# 다른 TopicArn은 403으로 거부한다(위조 방지 1차 — SNS 서명 검증이 2차). 비우면 ARN 체크를 건너뛴다(dev).
# 운영은 SES→SNS 배선 후 그 토픽 ARN을 BOOKTIMER_SES_SNS_TOPIC_ARN 으로 주입.
booktimer.ses.sns.topic-arn=${BOOKTIMER_SES_SNS_TOPIC_ARN:}

# --- 재참여 넛지 (마케팅 — 정보통신망법 §50 광고성) ---
# transactional과 분리된 점등 토글. 기본 꺼짐(false) — true일 때만 RetentionNudgeScheduler가 빈 등록되어
# 매일 KST 10시 배치가 돈다. email.enabled와 따로 두는 이유: 이메일 점등 시 가입 인증·비번 재설정(transactional,
# 규제 무관)만 먼저 켜고, 마케팅 넛지는 법무 9박스(opt-in·(광고)표시·수신거부·야간제한) 충족 후 별도로 켜기 위함.
booktimer.nudge.enabled=${BOOKTIMER_NUDGE_ENABLED:false}

# --- 정적 자산 콘텐츠 해시 (캐시 stale 근본 해결) ---
# Spring이 정적 자산 파일 내용의 MD5 해시를 URL에 삽입한다(/css/app.css → /css/app-<md5>.css).
# Thymeleaf @{} 표현식이 ResourceUrlProvider를 통해 해시 URL로 자동 변환되므로 빌드 파이프라인 무변경.
# 내용이 바뀌면 URL이 바뀌어 SW·브라우저 캐시가 구조적으로 stale이 되지 않는다.
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
# 해시 URL은 내용이 바뀌지 않는 한 URL 자체가 동일하므로 장기 캐시 안전(365일 public)
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# --- 토스 앱인토스(미니앱) 서버 연동 ---
# 토스 로그인 서버 연동은 mTLS 필수다. 클라이언트 인증서·키는 앱인토스 콘솔에서 발급받아 서버에 파일로 두고
# SSL 번들(spring.ssl.bundle.pem.toss.*)로 읽는다 — 레포에 인증서 실파일 커밋 금지(OAuth 키와 동일 정책).
# 번들이 없으면 앱은 정상 기동하고 토스 호출 시점에만 실패한다(dark-launch — 인증서 발급 전에도 나머지 기능 무영향).
booktimer.toss.api-base-url=${BOOKTIMER_TOSS_API_BASE_URL:https://apps-in-toss-api.toss.im}
booktimer.toss.ssl-bundle=${BOOKTIMER_TOSS_SSL_BUNDLE:toss}
# spring.ssl.bundle.pem.toss.keystore.certificate=file:/etc/booktimer/toss/client-cert.pem
# spring.ssl.bundle.pem.toss.keystore.private-key=file:/etc/booktimer/toss/client-key.pem

# 미니앱 번들은 토스 인프라 오리진에서 서빙돼 우리 /api/** 호출이 교차 출처가 된다. 실제 WebView 오리진 값은
# PR-0 샌드박스 실측으로만 확정되므로 하드코딩하지 않고 프로퍼티로 둔다. 기본은 빈 값(= CORS 미적용, 안전 기본값)
# — 실측 후 BOOKTIMER_MINIAPP_ALLOWED_ORIGINS 에 콤마 구분으로 주입한다.
booktimer.miniapp.allowed-origins=${BOOKTIMER_MINIAPP_ALLOWED_ORIGINS:}
