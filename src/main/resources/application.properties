spring.application.name=booktimer

# --- OAuth2 소셜 로그인 (Google) ---
# 실제 client-id/secret 은 환경변수(GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET)로 주입한다.
# 커밋에는 절대 실값을 넣지 않는다. 기본값('not-configured')은 자격증명이 없어도 앱이 부팅되게
# 하기 위한 placeholder — 이 상태에서 구글 버튼을 누르면 구글이 invalid_client로 막는다(정상).
# 'google'은 스프링이 아는 표준 provider라 authorization/token/issuer URI가 자동으로 채워진다.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
